<style>
  :root{
    --turquoise:#40ada9; --pink:#e4378c; --yellow:#f2c749; --purple:#68416c; --red:#d83335;
    --ink:#141617;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;background:#0c0d0e;
    font-family:'Arial Narrow',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;touch-action:none;user-select:none;
  }
  /* ANTES: #game-holder tenía aspect-ratio fijo por ANCHO, sin mirar la altura real de la
     pantalla — en un móvil con poca altura visible (barra del navegador, etc.) esto podía
     empujar los controles (el botón TAJO) fuera de la pantalla, invisibles, sin poder
     hacer scroll (body tiene overflow:hidden). Ahora #wrap ocupa la altura real del
     viewport y #game-holder se queda con lo que sobra — los controles SIEMPRE caben. */
  #wrap{
    position:relative;width:min(420px,100vw);
    height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
  }
  #marquee{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;
    padding:8px 0;background:linear-gradient(180deg,#241014,#0c0d0e);
    border:2px solid var(--yellow);border-bottom:none;border-radius:10px 10px 0 0;
  }
  #marquee img{width:26px;height:17px;filter:drop-shadow(0 0 4px rgba(64,173,169,.8));}
  #marquee span{font-family:'Impact',Arial Narrow,sans-serif;font-size:13px;letter-spacing:1px;color:var(--yellow);text-shadow:0 0 6px rgba(242,199,73,.6);}
  /* flex:1 + min-height:0 = se queda con la altura que sobre, NUNCA empuja los controles fuera */
  #game-holder{
    width:100%;flex:1;min-height:0;position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.5);
    border:5px solid var(--ink);border-top:none;border-bottom:none;
    background:#000;
  }
  #controls{
    display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
    width:100%;padding:12px 16px;background:#0c0d0e;
    border:2px solid var(--yellow);border-top:none;border-radius:0 0 10px 10px;
  }
  #move-btns{display:flex;gap:10px;}
  .ctrl{
    background:linear-gradient(145deg,#26282b,#141617);
    border:2px solid var(--yellow);border-radius:14px;
    color:var(--yellow);font-size:24px;width:56px;height:54px;
    box-shadow:0 3px 0 #000;
  }
  .ctrl:active{transform:translateY(2px);box-shadow:0 1px 0 #000;}
  #jump-btn{
    background:linear-gradient(145deg,var(--yellow),#c99a1f);
    border:2px solid #fff8d0;border-radius:50%;
    color:#2a1e00;font-size:12px;font-weight:900;
    width:64px;height:64px;box-shadow:0 4px 0 #8a6a10;
  }
  #jump-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a10;}
  #attack-btn{
    background:linear-gradient(145deg,var(--red),#8f1417);
    border:3px solid #ffd7d7;border-radius:50%;
    color:#fff;font-size:15px;font-weight:900;line-height:1.05;
    width:78px;height:78px;box-shadow:0 4px 0 #5c0d0f;
    margin-right:8px;
  }
  #attack-btn small{display:block;font-size:9px;font-weight:700;opacity:.85;letter-spacing:.5px;}
  #attack-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5c0d0f;}
  #mute-btn{
    position:absolute;top:8px;right:8px;z-index:10;
    width:34px;height:34px;border-radius:50%;
    background:rgba(12,13,14,.7);border:2px solid var(--yellow);
    color:var(--yellow);font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  #thesis-overlay{
    position:absolute;inset:0;z-index:20;display:none;
    background:rgba(6,7,8,.94);flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  #thesis-overlay.show{display:flex;}
  #thesis-overlay h3{font-family:Impact,Arial Narrow,sans-serif;color:var(--yellow);font-size:18px;margin:0 0 8px;}
  #thesis-overlay p{font-family:Georgia,serif;color:#fff;font-size:13px;line-height:1.5;margin:0 0 16px;}
  #thesis-input{
    width:90%;padding:10px;border-radius:8px;border:2px solid var(--turquoise);
    background:#141617;color:#fff;font-size:14px;text-align:center;margin-bottom:14px;

    background:var(--yellow);border:none;border-radius:10px;padding:10px 22px;
    font-family:Impact,Arial Narrow,sans-serif;font-size:15px;color:#141617;

<body>
<div id="wrap">
  <div id="marquee"><img src="fotos/instante_logo.png" alt="Instante"><span>INSTANTE ARCADE</span></div>

    <button id="mute-btn">🔊</button>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════
   AIDA — Vol. 1: La Ola
   Motor: Phaser 3 (Arcade Physics)
   ════════════════════════════════════════════════════════ */
const PALETTE = { turquoise:0x40ada9, pink:0xe4378c, yellow:0xf2c749, purple:0x68416c, red:0xd83335, ink:0x141617 };
const W = 378, H = 546; // 9:13-ish, escala con CSS

const keys = { left:false, right:false };
let activeChapter1 = null; // referencia a la escena activa, para que el overlay HTML del tutor pueda avisarla
let jumpRequested = false;
let attackRequested = false;

/* ---------- VOZ — que lo diga en voz alta, con la voz española que haya en el dispositivo ---------- */
// Aviso honesto: el navegador NO tiene voces regionales (andaluza vs. "neutra") — solo elige
// entre las voces "es-ES"/"es" que traiga instalado el propio móvil/ordenador de Manuel.
// No hay manera de forzar acento andaluz específico desde aquí, solo español de España si existe.
let spanishVoice = null;
function pickSpanishVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  spanishVoice = voices.find(v=>v.lang==='es-ES') || voices.find(v=>v.lang && v.lang.startsWith('es')) || null;
}
if('speechSynthesis' in window){
  pickSpanishVoice();
  window.speechSynthesis.onvoiceschanged = pickSpanishVoice;
}
function speakPhrase(text){
  if(!('speechSynthesis' in window) || isMuted) return;
  const clean = text.replace(/[¡!¿?"]/g,'');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'es-ES'; u.rate = 1.02; u.pitch = 1.1;
  if(spanishVoice) u.voice = spanishVoice;
  window.speechSynthesis.cancel(); // que no se amontonen frases
  window.speechSynthesis.speak(u);
}

/* ---------- SONIDO DE ESPADA (sintetizado, sin licencias de por medio) ---------- */
function playSwoosh(scene){
  const ctx = scene.sound.context;
  if(!ctx || isMuted) return;
  const dur = 0.22;
  const buffer = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(2600, ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(500, ctx.currentTime+dur);
  filter.Q.value = 1.1;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.85, ctx.currentTime); // subido de 0.5 — Manuel: "que se oiga mejor la lucha"
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start();
  // "clang" agudo justo detrás del silbido, para el golpe seco tipo katana
  const clang = ctx.createOscillator();
  clang.type = 'triangle'; clang.frequency.setValueAtTime(1800, ctx.currentTime+0.03);
  clang.frequency.exponentialRampToValueAtTime(300, ctx.currentTime+0.14);
  const clangGain = ctx.createGain();
  clangGain.gain.setValueAtTime(0.6, ctx.currentTime+0.03); // subido de 0.35
  clangGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.16);
  clang.connect(clangGain); clangGain.connect(ctx.destination);
  clang.start(ctx.currentTime+0.03); clang.stop(ctx.currentTime+0.16);
}

/* ---------- GOLPE QUE ATERRIZA (impacto seco y grave, para que el tajo SUENE a que ha dado) ---------- */
function playImpact(scene){
  const ctx = scene.sound.context;
  if(!ctx || isMuted) return;
  const t0 = ctx.currentTime;
  // golpe grave
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(190, t0);
  osc.frequency.exponentialRampToValueAtTime(48, t0+0.20);
  const g1 = ctx.createGain();
  g1.gain.setValueAtTime(0.9, t0);
  g1.gain.exponentialRampToValueAtTime(0.001, t0+0.24);
  osc.connect(g1); g1.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+0.25);
  // chasquido corto encima, para que se note el corte
  const dur = 0.09;
  const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g2 = ctx.createGain();
  g2.gain.setValueAtTime(0.55, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(g2); g2.connect(ctx.destination);
  src.start(t0);
}

/* ---------- BLIPS DE ARCADE (moneda, salto, daño) — "tienen que sonar también" ---------- */
function playBlip(scene, f0, f1, dur, type, vol){
  const ctx = scene.sound.context;
  if(!ctx || isMuted) return;
  const t0 = ctx.currentTime;
  const o = ctx.createOscillator();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol || 0.3, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const sfxCoin  = s => playBlip(s, 620, 1250, 0.14, 'triangle', 0.32);
const sfxBonus = s => playBlip(s, 780, 1700, 0.20, 'square',   0.26);
const sfxJump  = s => playBlip(s, 300,  660, 0.13, 'triangle', 0.26);
const sfxHurt  = s => playBlip(s, 400,   90, 0.30, 'sawtooth', 0.34);

/* ---------- MÚSICA ---------- */
let currentMusic = null;
let isMuted = false;
function playMusic(scene, key, opts){
  if(typeof paraMusicaPropia === 'function') paraMusicaPropia(); // que no se solapen
  opts = opts || {};
  const loop = opts.loop !== undefined ? opts.loop : true;
  const volume = opts.volume !== undefined ? opts.volume : 0.45;
  if(currentMusic) currentMusic.stop();
  currentMusic = scene.sound.add(key, {loop, volume: isMuted ? 0 : volume});
  currentMusic.baseVolume = volume;
  currentMusic.play();
  return currentMusic;
}
function toggleMute(){
  isMuted = !isMuted;
  if(currentMusic) currentMusic.setVolume(isMuted ? 0 : currentMusic.baseVolume);
  if(motorMusica) motorMusica.master.gain.value = isMuted ? 0 : motorMusica.volBase;
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
}

/* ══════════════════════════════════════════════════════════════════════════
   MÚSICA PROPIA DE CADA CAPÍTULO — sintetizada aquí mismo (Web Audio)
   Manuel: "en la de Corpus pon algo de flamenquito, en vez de la música de
   siempre". En vez de bajar pistas de terceros (licencias, peso, permisos),
   se toca en directo en el navegador: guitarra de cuerda pulsada de verdad
   (Karplus-Strong), palmas, cajón y bajo. Cero ficheros, cero licencias, y
   cada capítulo suena distinto.
   ══════════════════════════════════════════════════════════════════════════ */
let motorMusica = null;   // el que esté sonando ahora, para poder pararlo

// notas -> frecuencia (La4 = 440)
const NOTA = {
  E2:82.41, F2:87.31, G2:98.00, A2:110.00, B2:123.47, C3:130.81, D3:146.83,
  E3:164.81, F3:174.61, G3:196.00, Gs3:207.65, A3:220.00, B3:246.94, C4:261.63,
  D4:293.66, E4:329.63, F4:349.23, Gs4:415.30, A4:440.00, B4:493.88, C5:523.25, E5:659.25,
};

/* cuerda pulsada de verdad: Karplus-Strong (ruido + retardo con promediado).
   Suena a guitarra española, no a pitido de sintetizador. */
const _cacheCuerda = new Map();
function bufferCuerda(ctx, freq, dur){
  const clave = Math.round(freq*2) + '|' + Math.round(dur*20);
  let buf = _cacheCuerda.get(clave);
  if(buf) return buf;
  const N = Math.max(2, Math.round(ctx.sampleRate/freq));
  buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate);
  const d = buf.getChannelData(0);
  const anillo = new Float32Array(N);
  for(let i=0;i<N;i++) anillo[i] = Math.random()*2-1;
  let k = 0;
  for(let i=0;i<d.length;i++){
    const actual = anillo[k], siguiente = anillo[(k+1)%N];
    d[i] = actual;
    anillo[k] = (actual + siguiente) * 0.5 * 0.996;   // el 0.996 es cuánto tarda en apagarse
    k = (k+1)%N;
  }
  _cacheCuerda.set(clave, buf);
  return buf;
}
function cuerda(ctx, dest, freq, t, dur, vol){
  const src = ctx.createBufferSource(); src.buffer = bufferCuerda(ctx, freq, dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(g); g.connect(dest);
  src.start(t);
}

/* rasgueo: las cuerdas del acorde una detrás de otra, muy juntas — eso es lo que
   distingue un rasgueo flamenco de tocar un acorde de golpe */
function rasgueo(ctx, dest, notas, t, vol, arriba){
  const orden = arriba ? notas : notas.slice().reverse();
  orden.forEach((n,i)=> cuerda(ctx, dest, NOTA[n], t + i*0.014, 1.1, vol*(0.75+i*0.06)));
}

/* palmas: ruido corto y seco, filtrado, con un pelín de variación para que no
   suene a máquina (dos palmeros nunca dan igual) */
let _cachePalmas = null;
function palma(ctx, dest, t, vol){
  const dur = 0.09;
  if(!_cachePalmas){
    _cachePalmas = [];
    for(let v=0;v<6;v++){                       // 6 palmas distintas: dos palmeros nunca dan igual
      const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate);
      const dd = b.getChannelData(0);
      for(let i=0;i<dd.length;i++) dd[i] = (Math.random()*2-1) * Math.pow(1-i/dd.length, 2.2);
      _cachePalmas.push(b);
    }
  }
  const src = ctx.createBufferSource(); src.buffer = _cachePalmas[(Math.random()*6)|0];
  const f = ctx.createBiquadFilter();
  f.type='bandpass'; f.frequency.value = 1500 + Math.random()*900; f.Q.value = 1.1;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol*(0.85+Math.random()*0.3), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(f); f.connect(g); g.connect(dest);
  src.start(t);
}

/* golpe grave: sirve de cajón, de bombo y de bajo según la frecuencia */
function golpe(ctx, dest, t, f0, f1, dur, vol, tipo){
  const o = ctx.createOscillator();
  o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t+dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t+dur+0.02);
}

/* nota de sintetizador con filtro, para los capítulos que no son flamencos */
function sinte(ctx, dest, freq, t, dur, vol, tipo, corte){
  const o = ctx.createOscillator();
  o.type = tipo || 'sawtooth';
  o.frequency.setValueAtTime(freq, t);
  const f = ctx.createBiquadFilter();
  f.type='lowpass';
  f.frequency.setValueAtTime(corte || 1800, t);
  f.frequency.exponentialRampToValueAtTime(420, t+dur);
  f.Q.value = 6;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(f); f.connect(g); g.connect(dest);
  o.start(t); o.stop(t+dur+0.02);
}

/* ---------- LOS ESTILOS: un compás por función ---------- */
// CORPUS — tangos flamencos en 4/4, cadencia andaluza (Am-G-F-E), palmas a
// contratiempo y rasgueo. Es lo que pidió: flamenquito.
const ACORDES_ANDALUZ = [
  ['A2','E3','A3','C4','E4'],   // Am
  ['G2','D3','G3','B3','D4'],   // G
  ['F2','C3','F3','A3','C4'],   // F
  ['E2','B2','E3','Gs3','B3'],  // E  ← el que hace que suene a flamenco
];
function compasFlamenco(ctx, dest, t, compas, tiempo){
  const ac = ACORDES_ANDALUZ[compas % 4];
  rasgueo(ctx, dest, ac, t,              0.16, false);
  rasgueo(ctx, dest, ac, t + tiempo*1.5, 0.10, true);
  rasgueo(ctx, dest, ac, t + tiempo*2.5, 0.13, false);
  rasgueo(ctx, dest, ac, t + tiempo*3.5, 0.09, true);
  // palmas: los tangos van a 2 y 4, con un remate en el 4 y medio
  [1, 3, 3.5].forEach(b=> palma(ctx, dest, t + tiempo*b, 0.16));
  if(compas % 2 === 1) palma(ctx, dest, t + tiempo*2.5, 0.11);
  // cajón
  [0, 2].forEach(b=> golpe(ctx, dest, t + tiempo*b, 150, 55, 0.16, 0.30));
  // falseta suelta cada cuatro compases, para que respire
  if(compas % 4 === 3){
    ['A4','G3','F3','E3'].forEach((n,i)=> cuerda(ctx, dest, NOTA[n], t + tiempo*(2+i*0.4), 0.9, 0.13));
  }
}

// LA BARRA — neón: arpegio de sintetizador y bombo a negras
function compasNeon(ctx, dest, t, compas, tiempo){
  const escalas = [['A3','C4','E4','A4'], ['G3','B3','D4','G3'], ['F3','A3','C4','F3'], ['E3','Gs3','B3','E4']];
  const arp = escalas[compas % 4];
  for(let i=0;i<8;i++) sinte(ctx, dest, NOTA[arp[i%4]] * (i>=4?2:1), t + tiempo*i*0.5, 0.26, 0.075, 'sawtooth', 2400);
  for(let b=0;b<4;b++) golpe(ctx, dest, t + tiempo*b, 130, 44, 0.17, 0.34);
  [1,3].forEach(b=> palma(ctx, dest, t + tiempo*b, 0.10));
  golpe(ctx, dest, t, NOTA[['A2','G2','F2','E2'][compas%4]], NOTA[['A2','G2','F2','E2'][compas%4]], tiempo*3.6, 0.16, 'triangle');
}

// LA MILLA — carrera: pulso rápido y brillante, para correr
function compasCarrera(ctx, dest, t, compas, tiempo){
  const notas = [['A3','E4','A4','E4'], ['G3','D4','G4','D4'], ['F3','C4','F4','C4'], ['E3','B3','E4','B3']][compas%4];
  for(let i=0;i<8;i++) sinte(ctx, dest, NOTA[notas[i%4]]||440, t + tiempo*i*0.5, 0.18, 0.06, 'square', 3000);
  for(let b=0;b<4;b++) golpe(ctx, dest, t + tiempo*b, 120, 42, 0.14, 0.30);
  for(let b=0;b<8;b++) palma(ctx, dest, t + tiempo*(b*0.5+0.25), 0.055);
}

// INSTANTE HQ — tensión de oficina: bordón grave y pinchazos sueltos
function compasOficina(ctx, dest, t, compas, tiempo){
  golpe(ctx, dest, t, NOTA.E2, NOTA.E2, tiempo*4, 0.13, 'sawtooth');
  const pin = [['A3','C4'],['G3','B3'],['F3','A3'],['E3','Gs3']][compas%4];
  pin.forEach((n,i)=> sinte(ctx, dest, NOTA[n], t + tiempo*(i*1.5), 0.7, 0.075, 'triangle', 1100));
  golpe(ctx, dest, t, 160, 50, 0.2, 0.26);
  if(compas%2===1) golpe(ctx, dest, t + tiempo*2.5, 160, 50, 0.18, 0.20);
  if(compas%4===3) palma(ctx, dest, t + tiempo*3.5, 0.12);
}

// volúmenes medidos con el pico real de cada estilo (0,29-0,49) para que suenen igual de
// fuerte que la música de fichero de antes, sin llegar a saturar
// ── DOS ESTILOS MÁS, para las escenas que Manuel quiere marcar ──────────────
// ÁNGEL: la madre. Lento, alto, luminoso, con mucho aire entre nota y nota.
function compasAngel(ctx, dest, t, compas, tiempo){
  const acorde = [['A3','C4','E4','A4'], ['F3','A3','C4','F4'], ['G3','B3','D4','G4'], ['E3','Gs3','B3','E4']][compas%4];
  acorde.forEach((n,i)=> cuerda(ctx, dest, NOTA[n], t + i*0.26, 2.6, 0.10));
  sinte(ctx, dest, NOTA[acorde[0]]/2, t, tiempo*4, 0.05, 'triangle', 700);   // colchón grave
  cuerda(ctx, dest, NOTA[acorde[3]]*2, t + tiempo*2.4, 1.8, 0.05);           // campanita
}
// JEFE: la pelea. Grave, machacón, con palmas rápidas y disonancia.
function compasJefe(ctx, dest, t, compas, tiempo){
  for(let b=0;b<4;b++) golpe(ctx, dest, t + tiempo*b, 150, 42, 0.18, 0.40);
  for(let b=0;b<8;b++) palma(ctx, dest, t + tiempo*(b*0.5+0.25), 0.09);
  golpe(ctx, dest, t, NOTA.E2, NOTA.E2, tiempo*3.8, 0.20, 'sawtooth');
  const stab = [['E3','F3'], ['E3','Gs3'], ['F3','A3'], ['E3','F3']][compas%4];  // el mi-fa es la tensión
  stab.forEach((n,i)=> sinte(ctx, dest, NOTA[n], t + tiempo*(1.5+i*0.25), 0.5, 0.11, 'sawtooth', 1500));
  if(compas%2===1) cuerda(ctx, dest, NOTA.E4, t + tiempo*3.2, 0.8, 0.10);
}

const ESTILOS = {
  flamenco: {bpm:104, compas: compasFlamenco, vol:1.00},
  neon:     {bpm:124, compas: compasNeon,     vol:0.85},
  carrera:  {bpm:150, compas: compasCarrera,  vol:1.05},
  oficina:  {bpm: 92, compas: compasOficina,  vol:0.95},
  angel:    {bpm: 58, compas: compasAngel,    vol:0.80},
  jefe:     {bpm:132, compas: compasJefe,     vol:1.00},
};

/* arranca la banda: va escribiendo compases por delante, con un poco de colchón,
   para que no se oigan cortes aunque el navegador vaya justo */
function arrancaMusicaPropia(scene, estilo){
  paraMusicaPropia();
  if(currentMusic){ currentMusic.stop(); currentMusic = null; }
  const cfg = ESTILOS[estilo];
  const ctx = scene.sound.context;
  if(!cfg || !ctx) return null;
  const master = ctx.createGain();
  master.gain.value = isMuted ? 0 : cfg.vol;
  master.connect(ctx.destination);
  const tiempo = 60/cfg.bpm;         // duración de una negra
  const largoCompas = tiempo*4;
  let compas = 0;
  let siguiente = ctx.currentTime + 0.15;
  const escribe = ()=>{
    // escribe todo lo que quepa en el próximo segundo y medio
    while(siguiente < ctx.currentTime + 1.5){
      cfg.compas(ctx, master, siguiente, compas, tiempo);
      siguiente += largoCompas;
      compas++;
    }
  };
  escribe();
  const reloj = scene.time.addEvent({delay:500, loop:true, callback:escribe});
  motorMusica = {
    master, reloj, volBase: cfg.vol,
    para(){ try{ reloj.remove(); master.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
                 setTimeout(()=>{ try{ master.disconnect(); }catch(e){} }, 400); }catch(e){} },
  };
  return motorMusica;
}
function paraMusicaPropia(){
  if(motorMusica){ motorMusica.para(); motorMusica = null; }
}

   LOS 5 CAPÍTULOS — un solo motor + una ficha por capítulo
   Antes esto era una clase `Chapter1` con todo escrito a pelo. Para hacer 5
   niveles habría que haberla copiado 5 veces, y cada retoque de Manuel habría

   vez en `class Capitulo` y cada capítulo es una FICHA de datos.

const GROUND_Y = 460;

// El suelo se construye a partir de los ANCHOS de cada tramo, con huecos iguales,
// y de ahí sale el ancho del mundo. Así es IMPOSIBLE que la meta, un enemigo o una
// moneda queden flotando sobre un pozo, que es el error clásico al alargar un nivel.
function construyeSuelo(anchos, hueco){
  const segs = []; let x = 0;
  anchos.forEach(w=>{ segs.push({x, w}); x += w + hueco; });
  return { segs, world: x - hueco };
}
const centro = s => s.x + s.w/2;

    n:5, musica:'oficina', key:'Cap5', nombre:'Instante HQ', sub:'tu gente está encerrada y el Cliente Imposible te espera',
    anchos:[520,480,500,480,520,480,380], hueco:100,
    cielo:[0x123b3a, 0x061615], camara:'#0a1f1e', estilo:'oficina',
    rotulosRojos:['OFERTA FINAL','O VENDÉIS O CERRÁIS','TENEMOS A TU GENTE'],
    rotulosSuyos:['AQUÍ MANDAN ELLAS','NO SE BRILLA\nSIN OSCURIDAD','INSTANTE'],
    apertura:'¡Muerte a los caraduras!',
    frases:['¡Soltad a mi gente!','¡Toma kit digital!','¡Aquí mando yo!','¡Ni un euro por Instante!'],
    repisas:[{t:1, off:-60},{t:4, off:80}],
    enemigos:[{t:1,tipo:'urgente'},{t:2,tipo:'burocracia'},{t:2,tipo:'machirulo',off:170},
              {t:4,tipo:'urgente'},{t:4,tipo:'machirulo2',off:170}],
    aliada:{t:2, off:-180, quien:'brenda'},
    carcel:{t:3, vidas:7},
    jefe:{t:5, vidas:6},
    meta:{tipo:'final', titulo:'¡INSTANTE SIGUE SIENDO SUYA!', grito:'¡No se brilla sin oscuridad!'},
    ultimo:true,
  },
];
CAPITULOS.forEach(c=>{
  const s = construyeSuelo(c.anchos, c.hueco);
  c.segs = s.segs; c.world = s.world;
});
const capPorKey = k => CAPITULOS.find(c=>c.key===k);

/* ---------- PROGRESO (se guarda en el propio navegador) ---------- */
function progresoLeer(){
  try { return parseInt(localStorage.getItem('aida_progreso')||'0',10) || 0; } catch(e){ return 0; }
}
function progresoGuardar(n){
  try { if(n > progresoLeer()) localStorage.setItem('aida_progreso', String(n)); } catch(e){}
}

/* ---------- SELECTOR DE CAPÍTULOS ---------- */
class Menu extends Phaser.Scene {
  constructor(){ super('Menu'); }
  create(){
    this.cameras.main.setBackgroundColor('#0c0d0e');
    const cx = W/2;
    this.add.image(cx, 46, 'instanteLogo').setDisplaySize(64,41).setAlpha(0.95);
    this.add.text(cx, 84, 'AIDA', {fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'40px', color:'#ffffff'}).setOrigin(0.5);
    this.add.text(cx, 112, 'elige capítulo', {fontFamily:'Georgia, serif', fontSize:'12px', color:'#40ada9', fontStyle:'italic'}).setOrigin(0.5);
    const hechos = progresoLeer();
    CAPITULOS.forEach((c,i)=>{
      const y = 152 + i*66;
      const abierto = i <= hechos;           // se abre el siguiente al terminar el anterior
      const completo = i < hechos;
      const col = abierto ? PALETTE.purple : 0x24262a;
      const caja = this.add.rectangle(cx, y, W-44, 56, col, abierto?1:0.55)
        .setStrokeStyle(3, abierto ? PALETTE.turquoise : 0x3a3d3f);
      this.add.text(cx-W/2+34, y-11, `VOL. ${c.n}`, {fontFamily:'Impact', fontSize:'14px', color: abierto?'#f2c749':'#5a5d61'}).setOrigin(0,0.5);
      this.add.text(cx-W/2+34, y+9, c.nombre.toUpperCase(), {fontFamily:'Impact', fontSize:'19px', color: abierto?'#ffffff':'#5a5d61'}).setOrigin(0,0.5);
      this.add.text(cx+W/2-36, y, completo ? '✅' : abierto ? '▶' : '🔒', {fontSize:'20px'}).setOrigin(0.5);
      if(abierto){
        caja.setInteractive({useHandCursor:true});
        caja.on('pointerdown', ()=> this.scene.start('Title', {key:c.key}));
      }
    });
    this.add.text(cx, H-26, hechos>=CAPITULOS.length ? '¡los cinco, completados! 🦄' : 'se abre el siguiente al terminar el anterior',
      {fontFamily:'Arial', fontSize:'11px', color:'#5a5d61'}).setOrigin(0.5);
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   EL MOTOR DE NIVEL — la mecánica que Manuel ya dio por buena, una sola vez
   ══════════════════════════════════════════════════════════════════════════ */
class Capitulo extends Phaser.Scene {
  constructor(key){ super(key); }

  create(){
    const C = this.C = capPorKey(this.scene.key);
    this.WORLD = C.world;
    this.segs = C.segs;
    this.physics.world.setBounds(0,0,this.WORLD,H);
    this.cameras.main.setBounds(0,0,this.WORLD,H);
    this.cameras.main.setBackgroundColor(C.camara);

    this.score = 0; this.lives = 3; this.attacking = false; this.articulos = 0; this.phraseIndex = 0;
    this.win = false; this.respawnX = 80; this.saltoExtra = false; this.saltosDados = 0;
    this.drawBackground();

    // MÚSICA PROPIA DE CADA CAPÍTULO (Manuel: "en la de Corpus, flamenquito, no la de siempre").
    // Entra cuando se apaga la fanfarria de Verdi. El Vol. 1 conserva el silbido de spaghetti
    // western, que es su referencia de Kill Bill y ya le gustaba.
    this.time.delayedCall(8500, ()=>{
      if(!this.sys.isActive()) return;
      if(C.musica && C.musica !== 'western') arrancaMusicaPropia(this, C.musica);
      else playMusic(this, 'tension', {loop:true, volume:0.7});
    });
    // al salir del capítulo, que se calle
    this.events.once('shutdown', ()=> paraMusicaPropia());
    // cada capítulo arranca con SU frase y tiene SUS frases: antes los cinco empezaban igual
    // y decían lo mismo (Manuel: "todas las pantallas dicen lo mismo y empiezan haciendo lo mismo")
    this.frases = (C.frases || []).concat(CATCHPHRASES);
    this.time.delayedCall(1800, ()=>{ if(this.sys.isActive()) this.sayPhrase(C.apertura || CATCHPHRASES[0]); });

    this.construyePlataformas();
    this.construyeJugadora();
    this.physics.add.collider(this.player, this.platforms);

    this.enemies = this.physics.add.group({ allowGravity:false, immovable:true });
    C.enemigos.forEach(e=>{
      const s = this.segs[e.t];
      const x = centro(s) + (e.off||0);
      this.spawnEnemy(x, GROUND_Y-40, e.tipo, Math.max(s.x+50, x-150), Math.min(s.x+s.w-50, x+150));
    });
    this.physics.add.overlap(this.player, this.enemies, (pl,en)=>this.onEnemyTouch(en), null, this);

    if(C.aliada) this.construyeAliada();
    if(C.tutor)  this.construyeTutor();
    if(C.carcel) this.construyeCarcel();
    if(C.jefe){ this.construyeJefe(); this.construyeZonaAngel(); }
    this.construyeMonedas();
    this.construyeMeta();

    this.cameras.main.setZoom(1.0);
    this.cameras.main.startFollow(this.playerVisual, true, 0.1, 0.1);
    this.cameras.main.setDeadzone(80, 200);

    [PALETTE.turquoise, PALETTE.pink, PALETTE.yellow].forEach((c,i)=>{
      this.add.rectangle(W/2, H-8+i*3, W, 3, c, 0.8).setScrollFactor(0).setDepth(60);
    });
    this.hud = this.add.text(10,10, '', {fontFamily:'Arial', fontSize:'16px', color:'#141617', backgroundColor:'#ffffffaa', padding:{left:8,right:8,top:4,bottom:4}})
      .setScrollFactor(0).setDepth(60);
    // contrarreloj (solo La Milla): si llega a cero, se acabó
    if(C.tiempo){
      this.restante = C.tiempo;
      this.time.addEvent({delay:1000, loop:true, callback:()=>{
        if(this.win || this.lives<=0) return;
        this.restante--; this.updateHud();
        if(this.restante<=0){ this.lives=0; this.gameOver('¡SE TE FUE EL TIEMPO!'); }
      }});
    }
    this.updateHud();
  }

  /* ---------- construcción ---------- */
  construyePlataformas(){
    const C = this.C;
    this.platforms = this.physics.add.staticGroup();
    const BRAND = [PALETTE.turquoise, PALETTE.pink, PALETTE.yellow, PALETTE.purple];
    this.segs.forEach((s,si)=>{
      const p = this.add.rectangle(centro(s), GROUND_Y+30, s.w, 60, 0x2e1b33);
      this.physics.add.existing(p, true);
      this.platforms.add(p);
      // solo el filo de color: es lo que hace legible dónde se pisa (Manuel: "no se aprecian las plataformas")
      this.add.rectangle(centro(s), GROUND_Y, s.w, 9, BRAND[si%4]);
      this.add.rectangle(centro(s), GROUND_Y+7, s.w, 3, 0xffffff, 0.35);
      this.add.image(centro(s), GROUND_Y+40, 'instanteLogo').setDisplaySize(52,33).setAlpha(0.08);
    });
    // varias repisas por nivel (antes solo una): más sitios a los que subirse, menos monotonía.
    // En La Barra son TRAMPOLINES: al pisarlas te impulsan, que es lo suyo en el capítulo de volar.
    this.repisasX = [];
    this.trampolines = [];
    (C.repisas || []).forEach(r=>{
      const seg = this.segs[r.t];
      const x = centro(seg) + (r.off||0);
      this.repisasX.push(x);
      const l = this.add.rectangle(x, GROUND_Y-110, 140, 24, C.trampolin ? 0x123b3a : 0x2e1b33);
      this.add.rectangle(x, GROUND_Y-121, 140, 6, C.trampolin ? PALETTE.turquoise : PALETTE.pink);
      if(C.trampolin){
        this.add.text(x, GROUND_Y-134, '⬆', {fontSize:'17px', color:'#40ada9'}).setOrigin(0.5);
        this.trampolines.push(x);
      }
      this.physics.add.existing(l, true);
      this.platforms.add(l);
    });
  }

  construyeJugadora(){
    this.player = this.physics.add.sprite(80, GROUND_Y-110, null);
    this.player.body.setSize(55,140).setOffset(-27,-98);
    this.player.setCollideWorldBounds(true);
    this.player.setMaxVelocity(220, 900);
    this.player.setDragX(1200);
    // ELLA TAL CUAL — foto real recortada con rembg. 168px, tamaño fijado mirando un montaje a
    // tamaño real (medir con números engañó dos veces: el peinado de flamenca hincha la medida).
    this.heroImage = this.add.image(0,-42,'aidaHeroReal').setDisplaySize(93,168);
    this.logoBadge = this.add.image(8,-36,'instanteLogo').setDisplaySize(34,21);
    // KATANA de verdad: hoja curva (sori) que se afina, punta en diagonal (kissaki), línea de
    // temple (hamon), tsuba ovalada y tsuka trenzada. El contenedor vive EN la mano, así el tajo
    // pivota en la muñeca y no en el centro del cuerpo.
    const BL = 80, BN = 14, SORI = 13;
    const filo = [], lomo = [];
    for(let i=0;i<=BN;i++){
      const t = i/BN, y = 6 + BL*t, off = SORI*t*t, hw = 4.2*(1 - 0.35*t*t);
      filo.push({x: off+hw, y}); lomo.push({x: off-hw, y});
    }
    const poly = filo.concat([{x: SORI+2.5, y: 6+BL+9}], lomo.slice().reverse());
    this.bladePoly = poly;   // se guarda: la espada de fuego repinta esta misma hoja
    this.katanaBlade = this.add.graphics();
    this.katanaBlade.fillStyle(0xe8eef2,1); this.katanaBlade.fillPoints(poly, true);
    this.katanaBlade.lineStyle(1.4,0x8f9ba1,1); this.katanaBlade.strokePoints(poly, true);
    this.katanaBlade.lineStyle(1.2,0xffffff,0.8);
    this.katanaBlade.beginPath();
    for(let i=0;i<=BN;i++){
      const t = i/BN, y = 6 + BL*t;
      const x = SORI*t*t + 4.2*(1-0.35*t*t) - 1.6 + Math.sin(t*9)*0.7;
      if(i===0) this.katanaBlade.moveTo(x,y); else this.katanaBlade.lineTo(x,y);
    }
    this.katanaBlade.strokePath();
    this.katanaHilt = this.add.graphics();
    this.katanaHilt.fillStyle(0x141617,1); this.katanaHilt.fillRoundedRect(-4.5,-19,9,22,3);
    this.katanaHilt.lineStyle(1,0xb99a44,0.9);
    for(let i=0;i<4;i++){ this.katanaHilt.beginPath(); this.katanaHilt.moveTo(-4.5,-16+i*5); this.katanaHilt.lineTo(4.5,-13+i*5); this.katanaHilt.strokePath(); }
    this.katanaHilt.fillStyle(0xb99a44,1); this.katanaHilt.fillRect(-5.5,-20.5,11,3);
    this.katanaHilt.fillStyle(PALETTE.yellow,1); this.katanaHilt.fillEllipse(0,4,20,7);
    this.katanaHilt.lineStyle(1.2,0x141617,1); this.katanaHilt.strokeEllipse(0,4,20,7);
    this.katana = this.add.container(31,-36,[this.katanaBlade,this.katanaHilt]);
    this.katana.setRotation(Phaser.Math.DegToRad(8));
    this.cigBody = this.add.rectangle(-28,-36,18,4,0xf3ecd8,1).setStrokeStyle(1,0xcfc7ab).setAngle(-12);
    this.cigEmber = this.add.circle(-20,-39,2.6,PALETTE.red,1);
    this.cigSmoke = this.add.ellipse(-19,-50,8,12,0xcccccc,0.35);
    this.playerVisual = this.add.container(this.player.x, this.player.y,
      [this.heroImage, this.logoBadge, this.katana, this.cigSmoke, this.cigBody, this.cigEmber]);
  }

  construyeAliada(){
    const C = this.C, a = C.aliada, s = this.segs[a.t];
    const ax = centro(s) + (a.off||0);
    this.aliadaTipo = a.quien;
    this.aliadaShadow = this.add.ellipse(ax, GROUND_Y-2, 118, 14, 0x000000, 0.35);
    if(a.quien === 'brenda'){
      // OPCIÓN C (elegida por Manuel viendo las tres montadas a tamaño real): Brenda a la escala
      // buena del mundo —su cabeza igual que la de Aida— y un mostrador delante que tapa las
      // piernas que su foto, cortada a medio muslo, no tiene. Al unirse, el mostrador la acompaña.
      this.aliada = this.add.image(ax, GROUND_Y-120, 'brendaHeroReal').setDisplaySize(53,97);
      this.aliadaMueble = this.add.container(ax, 0, [
        this.add.rectangle(0, GROUND_Y-36, 116, 72, PALETTE.purple).setStrokeStyle(2, 0x2e1b33),
        this.add.rectangle(0, GROUND_Y-70, 122, 8, PALETTE.pink),
        this.add.text(0, GROUND_Y-40, 'INSTANTE', {fontFamily:'Impact', fontSize:'13px', color:'#ffffff'}).setOrigin(0.5),
      ]);
      this.aliadaNombre = 'BRENDA';
      this.aliadaCara = 'brendaFace';
    } else {
      // CONCHITA — de ella NO hay foto (⚠️ si Manuel consigue una, mismo proceso que con Brenda:
      // rembg + u2net_human_seg y se sustituye este dibujo). De momento, silueta de neón bailando.
      this.aliada = this.add.container(ax, GROUND_Y-84);
      const cuerpo = this.add.graphics();
      cuerpo.fillStyle(PALETTE.pink, 1);
      cuerpo.fillCircle(0,-54,15);                        // cabeza
      cuerpo.fillCircle(-13,-58,7); cuerpo.fillCircle(13,-58,7); // moño recogido de gimnasta
      cuerpo.fillRoundedRect(-11,-38,22,44,9);            // maillot
      cuerpo.fillRoundedRect(-40,-46,32,9,4.5);           // brazo izquierdo en alto, estirado
      cuerpo.fillRoundedRect(10,-30,30,9,4.5);            // brazo derecho abierto
      cuerpo.fillRoundedRect(-8,4,9,48,4);                // pierna de apoyo
      cuerpo.fillRoundedRect(4,4,42,9,4.5);               // la otra pierna, en spagat
      cuerpo.lineStyle(3, PALETTE.turquoise, 0.9); cuerpo.strokeCircle(0,-54,20);
      // la cinta de gimnasia rítmica, ondeando desde su mano
      const cinta = this.add.graphics();
      cinta.lineStyle(4, PALETTE.yellow, 0.95);
      cinta.beginPath(); cinta.moveTo(-40,-46);
      for(let i=1;i<=22;i++){ const t=i/22; cinta.lineTo(-40-t*54, -46 + Math.sin(t*7)*24 - t*10); }
      cinta.strokePath();
      this.aliada.add([cinta, cuerpo]);
      this.physics.add.existing(this.aliada);
      this.aliada.body.setSize(70, 168).setOffset(-35,-84);
      this.aliadaNombre = 'CONCHITA';
      this.aliadaCara = null;
    }
    this.aliadaLabel = this.add.text(ax, GROUND_Y-186, this.aliadaNombre, {
      fontFamily:'Impact', fontSize:'13px', color:'#ffffff', backgroundColor:'#68416c', padding:{left:5,right:5,top:2,bottom:2}
    }).setOrigin(0.5);
    if(!this.aliada.body) this.physics.add.existing(this.aliada);
    this.aliada.body.setAllowGravity(false);
    this.aliadaUsada = false; this.aliadaCooldown = false;
    this.physics.add.overlap(this.player, this.aliada, ()=>this.conocerAliada(), null, this);
  }

  construyeTutor(){
    const s = this.segs[this.C.tutor.t];
    const tx = centro(s) + (this.C.tutor.off||0);
    this.tutor = this.add.text(tx, GROUND_Y-46, '📚', {fontSize:'46px'}).setOrigin(0.5);
    this.add.text(tx, GROUND_Y-84, 'TUTOR', {fontFamily:'Impact', fontSize:'12px', color:'#ffffff', backgroundColor:'#68416c', padding:{left:5,right:5,top:2,bottom:2}}).setOrigin(0.5);
    this.physics.add.existing(this.tutor);
    this.tutor.body.setAllowGravity(false);
    this.tutorUsed = false;
    this.physics.add.overlap(this.player, this.tutor, ()=>this.meetTutor(), null, this);
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  EL JEFE FINAL — EL CLIENTE FINAL, un dragón enorme con bigotazo
  //  Manuel: "el monstruo final es el cliente final, el que tiene a la gente
  //  encarcelada; tiene que ser un monstruo muy grande con un gran bigote,
  //  tipo dragón chino". Se dibuja como criatura mitológica —cuerpo de
  //  serpiente, cuernos, melena, colmillos y las dos barbas largas— que es
  //  justo lo que describe, sin caricaturizar a nadie.
  // ══════════════════════════════════════════════════════════════════════════
  construyeJefe(){
    const s = this.segs[this.C.jefe.t];
    this.jefeX = centro(s);
    this.jefeVidas = this.C.jefe.vidas;
    this.jefeCuerpo = this.add.container(this.jefeX, GROUND_Y-92);  // pegado al suelo: a 120 flotaba despegado

    const d = this.add.graphics();
    // ── cuerpo serpenteante, de la cola a la cabeza ──
    const anillos = [
      {x: 120, y:  36, r: 20}, {x:  92, y:  10, r: 25}, {x:  60, y:  26, r: 29},
      {x:  26, y:   2, r: 33}, {x:  -8, y:  20, r: 35}, {x: -42, y:  -4, r: 34},
      {x: -74, y:  14, r: 31},
    ];
    anillos.forEach((a,i)=>{
      d.fillStyle(i%2 ? 0x1f7a4a : 0x2a9d5c, 1);
      d.fillCircle(a.x, a.y, a.r);
      d.fillStyle(0xf2c749, 0.55);                      // panza dorada
      d.fillEllipse(a.x, a.y + a.r*0.42, a.r*1.05, a.r*0.5);
    });
    // púas del lomo
    d.fillStyle(0xd83335, 1);
    anillos.forEach(a=> d.fillTriangle(a.x-9, a.y-a.r+4, a.x+9, a.y-a.r+4, a.x, a.y-a.r-15));

    // ── cabezón ──
    const hx = -122, hy = -14;
    d.fillStyle(0x2a9d5c, 1); d.fillEllipse(hx, hy, 108, 88);
    d.fillStyle(0x1f7a4a, 1); d.fillEllipse(hx-26, hy+18, 74, 46);      // morro
    // melena
    d.fillStyle(0xd83335, 1);
    for(let i=0;i<7;i++){
      const a = -1.5 + i*0.42;
      d.fillTriangle(hx+18, hy-6, hx+18+Math.cos(a)*54, hy-6+Math.sin(a)*54, hx+30, hy+10);
    }
    // cuernos
    d.fillStyle(0xe8d3b0, 1);
    d.fillTriangle(hx+4, hy-40, hx+16, hy-42, hx+34, hy-86);
    d.fillTriangle(hx-16, hy-42, hx-4, hy-40, hx-2, hy-90);
    // ojos con muy mala cara
    d.fillStyle(0xf2c749, 1); d.fillEllipse(hx-14, hy-10, 26, 20); d.fillEllipse(hx+20, hy-12, 24, 18);
    d.fillStyle(0x141617, 1); d.fillEllipse(hx-14, hy-10, 7, 17);  d.fillEllipse(hx+20, hy-12, 6, 15);
    d.fillStyle(0x8a1114, 1);                                        // cejas caídas y furiosas
    d.fillTriangle(hx-32, hy-30, hx-2, hy-20, hx-32, hy-18);
    d.fillTriangle(hx+38, hy-32, hx+8,  hy-22, hx+38, hy-20);
    // colmillos
    d.fillStyle(0xffffff, 1);
    d.fillTriangle(hx-46, hy+26, hx-36, hy+26, hx-41, hy+50);
    d.fillTriangle(hx-16, hy+28, hx-6,  hy+28, hx-11, hy+48);
    // ── EL BIGOTAZO: las dos barbas largas del dragón, ondeando ──
    this.bigotesJefe = this.add.graphics();
    const barba = (signo, desfase)=>{
      this.bigotesJefe.lineStyle(7, 0xf2c749, 1);
      this.bigotesJefe.beginPath();
      this.bigotesJefe.moveTo(hx-30, hy+22);
      for(let i=1;i<=16;i++){
        const t = i/16;
        this.bigotesJefe.lineTo(hx-30 - t*104, hy+22 + Math.sin(t*4.4 + desfase)*20*signo + t*16);
      }
      this.bigotesJefe.strokePath();
    };
    barba(1, 0); barba(-1, 1.6);
    // garras
    d.fillStyle(0xe8d3b0, 1);
    [[-70, 46],[10, 50]].forEach(([gx,gy])=>{
      for(let k=0;k<3;k++) d.fillTriangle(gx+k*11, gy, gx+7+k*11, gy, gx+3+k*11, gy+16);
    });

    this.jefeCuerpo.add([d, this.bigotesJefe]);
    this.jefeCuerpo.setScale(0.92);
    // el bigote ondea todo el rato
    this.tweens.add({targets:this.bigotesJefe, scaleY:1.18, duration:900, yoyo:true, repeat:-1, ease:'Sine.easeInOut'});
    this.tweens.add({targets:this.jefeCuerpo, y:GROUND_Y-104, duration:1700, yoyo:true, repeat:-1, ease:'Sine.easeInOut'});

    this.add.ellipse(this.jefeX, GROUND_Y-2, 210, 26, 0x000000, 0.45);
    this.jefeLabel = this.add.text(this.jefeX, GROUND_Y-250, 'EL CLIENTE FINAL', {
      fontFamily:'Impact', fontSize:'18px', color:'#ffffff', backgroundColor:'#d83335', padding:{left:9,right:9,top:3,bottom:3}
    }).setOrigin(0.5);
    this.add.rectangle(this.jefeX-80, GROUND_Y-226, 160, 12, 0x000000, 0.55).setOrigin(0,0.5);
    this.jefeBarra = this.add.rectangle(this.jefeX-80, GROUND_Y-226, 160, 12, PALETTE.red).setOrigin(0,0.5);

    this.physics.add.existing(this.jefeCuerpo);
    this.jefeCuerpo.body.setSize(240, 220).setOffset(-180, -110); // ajustada al bicho dibujado, no al centro
    this.jefeCuerpo.body.setAllowGravity(false);
    this.jefeDir = -1;
    this.physics.add.overlap(this.player, this.jefeCuerpo, ()=>{
      if(this.attacking) this.golpearJefe(); else this.hitEnemy({x:this.jefeCuerpo.x});
    }, null, this);
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  LA CÁRCEL — el monstruo intermedio del Vol. 5
  //  Manuel lo pidió así: su gente encerrada, un tío grande con bigote
  //  custodiándolos, y un INTERCAMBIO DE DIÁLOGOS MUY LENTO que frene a
  //  propósito el ritmo de la narrativa antes de la pelea. Las frases son
  //  literalmente las que dictó él; no se han suavizado ni adornado.
  // ══════════════════════════════════════════════════════════════════════════
  construyeCarcel(){
    const s = this.segs[this.C.carcel.t];
    const cx = centro(s) + (this.C.carcel.off||0);
    this.carcelX = cx;
    this.carcelVidas = this.C.carcel.vidas || 7;
    this.carcelAbierta = false;
    this.dialogoHecho = false;

    // la celda
    this.add.rectangle(cx-70, GROUND_Y-84, 210, 168, 0x0a1412).setStrokeStyle(5, 0x53585c);
    this.add.rectangle(cx-70, GROUND_Y-172, 226, 14, 0x53585c);
    this.presos = [];
    const gente = [
      {dx:-140, cara:'mamaFace',   nom:'MAMÁ'},
      {dx:-93,  cara:'primoFace',  nom:'DIEGO'},
      {dx:-47,  cara:'primo2Face', nom:'ALBERTO'},
      {dx:0,    cara:'manuelFace', nom:'MANUEL'},
    ];
    gente.forEach(g=>{
      const c = this.add.circle(cx+g.dx, GROUND_Y-104, 22, PALETTE.purple, 1).setStrokeStyle(2, 0x53585c);
      const f = this.add.image(cx+g.dx, GROUND_Y-104, g.cara).setDisplaySize(40,40);
      const n = this.add.text(cx+g.dx, GROUND_Y-74, g.nom, {fontFamily:'Impact', fontSize:'10px', color:'#ffffff'}).setOrigin(0.5);
      this.presos.push({c,f,n});
    });
    // los barrotes, delante de ellos
    this.barrotes = [];
    for(let i=0;i<9;i++){
      this.barrotes.push(this.add.rectangle(cx-166+i*24, GROUND_Y-84, 7, 166, 0x9aa2a8).setStrokeStyle(1, 0x53585c));
    }
    this.add.text(cx-70, GROUND_Y-192, 'TU GENTE', {
      fontFamily:'Impact', fontSize:'13px', color:'#ffffff', backgroundColor:'#d83335', padding:{left:6,right:6,top:2,bottom:2}
    }).setOrigin(0.5);

    // EL DEL BIGOTE — grandote, plantado delante de la celda, no patrulla
    const bx = cx + 120;
    this.bigoteX = bx;
    this.add.ellipse(bx, GROUND_Y-2, 104, 20, 0x000000, 0.45);
    this.bigote = this.add.container(bx, GROUND_Y-104);
    const g = this.add.graphics();
    g.fillStyle(0x232323,1); g.fillRoundedRect(-52,-62,104,128,14);      // corpachón
    g.fillStyle(0x3a3a3a,1); g.fillRoundedRect(-52,-62,104,22,10);       // hombreras
    g.fillStyle(0xe0bd97,1); g.fillCircle(0,-84,30);                     // cabezón
    g.fillStyle(0x141414,1); g.fillRect(-31,-108,62,16);                 // pelo
    g.fillStyle(0xffffff,1); g.fillCircle(-11,-88,7); g.fillCircle(11,-88,7);
    g.fillStyle(0x141617,1); g.fillCircle(-11,-88,3.6); g.fillCircle(11,-88,3.6);
    g.fillStyle(0x141414,1);                                             // EL BIGOTE, bien gordo
    g.fillEllipse(-13,-70,26,12); g.fillEllipse(13,-70,26,12);
    g.fillStyle(0x8a1114,1); g.fillRoundedRect(-16,-58,32,8,4);          // boca torcida
    this.bigote.add([g]);
    this.physics.add.existing(this.bigote);
    this.bigote.body.setSize(112,196).setOffset(-56,-116);
    this.bigote.body.setAllowGravity(false);
    this.bigoteLabel = this.add.text(bx, GROUND_Y-234, 'EL DEL BIGOTE', {
      fontFamily:'Impact', fontSize:'16px', color:'#ffffff', backgroundColor:'#d83335', padding:{left:8,right:8,top:3,bottom:3}
    }).setOrigin(0.5);
    this.add.rectangle(bx-62, GROUND_Y-212, 124, 10, 0x000000, 0.55).setOrigin(0,0.5);
    this.bigoteBarra = this.add.rectangle(bx-62, GROUND_Y-212, 124, 10, PALETTE.red).setOrigin(0,0.5);
    this.physics.add.overlap(this.player, this.bigote, ()=>{
      if(!this.dialogoHecho) return;                 // primero se habla, luego se pega
      if(this.attacking) this.golpearBigote(); else this.hitEnemy({x:this.bigote.x});
    }, null, this);

    // zona que dispara la conversación al acercarse
    this.zonaDialogo = this.add.zone(cx+30, GROUND_Y-100, 260, 220);
    this.physics.add.existing(this.zonaDialogo);
    this.zonaDialogo.body.setAllowGravity(false);
    this.physics.add.overlap(this.player, this.zonaDialogo, ()=>this.dialogoCarcel(), null, this);
  }

  // el intercambio LENTO, cartel a cartel, con el juego parado
  dialogoCarcel(){
    if(this.dialogoHecho || this.dialogando) return;
    this.dialogando = true;
    this.physics.pause();
    const BEATS = [
      {quien:'EL DEL BIGOTE', txt:'MUAJAJAJAJAJAJA...',                   color:'#d83335', risa:true},
      {quien:'EL DEL BIGOTE', txt:'VOY A DESTROZAR TU EMPRESA...',        color:'#d83335'},
      {quien:'EL DEL BIGOTE', txt:'...Y A TU FAMILIA.',                   color:'#d83335'},
      {quien:'AIDA',          txt:'¡ME CAGO EN TU PUTA MADRE, CABRÓN!',   color:'#f2c749'},
      {quien:'AIDA',          txt:'¡SUÉLTAME EL BRAZO!',                  color:'#f2c749'},
      {quien:'AIDA',          txt:'TE VOY A REBANAR EL BICHOTE.',          color:'#f2c749'},
      {quien:'AIDA',          txt:'NOT TODAY.',                           color:'#ffffff'},
    ];
    const velo = this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.72).setScrollFactor(0).setDepth(90);
    const quien = this.add.text(W/2, H*0.34, '', {fontFamily:'Impact', fontSize:'15px', color:'#8a8f94'}).setOrigin(0.5).setScrollFactor(0).setDepth(91);
    const linea = this.add.text(W/2, H*0.45, '', {
      fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'27px', color:'#ffffff',
      align:'center', wordWrap:{width:W-52}, lineSpacing:6
    }).setOrigin(0.5).setScrollFactor(0).setDepth(91);
    const pista = this.add.text(W/2, H-40, 'toca para seguir', {fontFamily:'Arial', fontSize:'11px', color:'#40ada9'})
      .setOrigin(0.5).setScrollFactor(0).setDepth(91).setAlpha(0.75);

    let i = -1, temporizador = null;
    const cerrar = ()=>{
      if(temporizador) temporizador.remove();
      this.input.off('pointerdown', siguiente);
      [velo,quien,linea,pista].forEach(o=>o.destroy());
      this.dialogando = false; this.dialogoHecho = true;
      this.physics.resume();
      // cartela de pelea, y a repartir
      const ya = this.add.text(W/2, H*0.42, 'PELEA', {
        fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'46px', color:'#d83335'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(91);
      this.tweens.add({targets:ya, scale:1.6, alpha:0, duration:900, onComplete:()=>ya.destroy()});
      playSwoosh(this);
      arrancaMusicaPropia(this, 'jefe');   // cambia la música al empezar la pelea
    };
    const siguiente = ()=>{
      i++;
      if(i >= BEATS.length){ cerrar(); return; }
      const b = BEATS[i];
      quien.setText(b.quien);
      linea.setText(b.txt).setColor(b.color);
      linea.setAlpha(0); quien.setAlpha(0);
      this.tweens.add({targets:[quien,linea], alpha:1, duration:320});
      if(b.risa){
        // que la risa se NOTE: tiembla la pantalla y el bigotudo se hincha de gusto
        linea.setFontSize('34px');
        this.cameras.main.shake(900, 0.006);
        if(this.bigote) this.tweens.add({targets:this.bigote, scaleX:1.14, scaleY:0.9, duration:220, yoyo:true, repeat:3});
      }
      speakPhrase(b.txt);
      if(temporizador) temporizador.remove();
      temporizador = this.time.delayedCall(b.risa ? 4000 : 3200, siguiente); // LENTO a propósito
    };
    this.input.on('pointerdown', siguiente);
    siguiente();
  }

  golpearBigote(){
    if(this.carcelAbierta || this.bigoteInvuln) return;
    this.bigoteInvuln = true;
    this.time.delayedCall(400, ()=> this.bigoteInvuln=false);
    this.carcelVidas--;
    playImpact(this);
    this.cameras.main.shake(200, 0.014);
    this.bigoteBarra.setScale(Math.max(0,this.carcelVidas)/(this.C.carcel.vidas||7), 1);
    this.tweens.add({targets:this.bigote, alpha:0.35, duration:80, yoyo:true, repeat:1});
    if(this.carcelVidas<=0) this.liberarFamilia();
  }

  liberarFamilia(){
    this.carcelAbierta = true;
    this.bigote.body.enable = false;
    this.bigoteLabel.setText('DERROTADO').setBackgroundColor('#40ada9');
    this.bigoteBarra.destroy();
    this.tweens.add({targets:this.bigote, alpha:0, y:this.bigote.y+50, angle:80, duration:800});
    this.score += 20; this.lives = Math.min(5, this.lives+1);
    this.updateHud();
    // los barrotes se abren
    this.barrotes.forEach((b,i)=> this.tweens.add({targets:b, y:b.y-190, alpha:0, duration:700, delay:i*45}));
    // y las tres frases, una detrás de otra, con su tiempo
    const decir = (txt, color, retraso, y)=>{
      this.time.delayedCall(retraso, ()=>{
        if(!this.sys.isActive()) return;
        speakPhrase(txt);
        const t = this.add.text(W/2, y, txt, {
          fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'19px', color:'#141617',
          backgroundColor:color, padding:{left:10,right:10,top:5,bottom:5}, align:'center', wordWrap:{width:W-60}
        }).setOrigin(0.5).setScrollFactor(0).setDepth(92);
        this.tweens.add({targets:t, alpha:0, duration:600, delay:2600, onComplete:()=>t.destroy()});
      });
    };
    decir('LUEGO TE PASO LA FACTURA.\nPOR MÍ Y POR TODOS LOS MÍOS.', '#f2c749', 300,  H*0.30);
    decir('¡VENGA, CHULOS, A DAROS UNA VUELTA!',                     '#40ada9', 3600, H*0.30);
    decir('¡GRACIAS, AIDA, ERES LA MEJOR!',                          '#e4378c', 6600, H*0.30);
    // la familia sale de la celda dando saltitos
    this.time.delayedCall(3600, ()=>{
      this.presos.forEach((p,i)=>{
        [p.c,p.f,p.n].forEach(o=> this.tweens.add({
          targets:o, x:o.x - 90 - i*30, y:o.y-16, duration:1500, delay:i*180, ease:'Sine.easeOut', yoyo:false
        }));
      });
      for(let i=0;i<26;i++){
        const c = [PALETTE.turquoise,PALETTE.pink,PALETTE.yellow,0xffffff][i%4];
        const p = this.add.rectangle(this.carcelX-70+Phaser.Math.Between(-90,90), GROUND_Y-150, 7, 10, c);
        this.tweens.add({targets:p, y:GROUND_Y-10, angle:Phaser.Math.Between(-300,300), alpha:0, duration:Phaser.Math.Between(900,1800), onComplete:()=>p.destroy()});
      }
    });
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  LA MADRE, EN FORMA DE ÁNGEL — antes de la pelea con el Cliente Imposible
  //  Pedido de Manuel: cámara lenta, mucho énfasis, la música cambia, y le da
  //  una ESPADA DE FUEGO para enfrentarse al malo. Es la escena más marcada
  //  del juego: todo va despacio a propósito.
  // ══════════════════════════════════════════════════════════════════════════
  construyeZonaAngel(){
    const s = this.segs[this.C.jefe.t];
    this.zonaAngel = this.add.zone(s.x + 36, GROUND_Y-110, 90, 260); // antes del alcance del dragón, para que la escena no acabe pegada a él
    this.physics.add.existing(this.zonaAngel);
    this.zonaAngel.body.setAllowGravity(false);
    this.angelHecho = false;
    this.physics.add.overlap(this.player, this.zonaAngel, ()=>this.escenaAngel(), null, this);
  }

  // cámara lenta de verdad: la física y los tweens se arrastran, pero los tiempos
  // del guion NO se tocan (si no, la escena duraría el triple sin querer)
  camaraLenta(activa){
    this.physics.world.timeScale = activa ? 3.2 : 1;
    this.tweens.timeScale = activa ? 0.45 : 1;
  }

  escenaAngel(){
    if(this.angelHecho || this.dialogando) return;
    this.angelHecho = true;
    this.dialogando = true;
    this.physics.pause();
    this.camaraLenta(true);
    arrancaMusicaPropia(this, 'angel');          // la música cambia: entra lo celestial

    const velo = this.add.rectangle(W/2, H/2, W, H, 0x04070c, 0.86).setScrollFactor(0).setDepth(90);
    // resplandor
    const halo = this.add.circle(W/2, H*0.30, 96, 0xfff4c4, 0.16).setScrollFactor(0).setDepth(91);
    this.tweens.add({targets:halo, scale:1.25, alpha:0.30, duration:2200, yoyo:true, repeat:-1});

    // el ángel: alas dibujadas + su cara de verdad
    const angel = this.add.container(W/2, H*0.30).setScrollFactor(0).setDepth(92).setAlpha(0);
    const alas = this.add.graphics();
    alas.fillStyle(0xffffff, 0.92);
    for(const lado of [-1, 1]){
      alas.beginPath();
      alas.moveTo(lado*22, -6);
      alas.lineTo(lado*96, -54);
      alas.lineTo(lado*104, -8);
      alas.lineTo(lado*84,  16);
      alas.lineTo(lado*96,  38);
      alas.lineTo(lado*34,  22);
      alas.closePath(); alas.fillPath();
      alas.lineStyle(2, 0xfff4c4, 0.9); alas.strokePath();
    }
    const aro   = this.add.circle(0, 0, 46, 0x000000, 0).setStrokeStyle(5, 0xf2c749);
    const cara  = this.add.image(0, 0, 'mamaFace').setDisplaySize(86, 86);
    const corona= this.add.ellipse(0, -62, 66, 16, 0x000000, 0).setStrokeStyle(4, 0xf2c749);
    angel.add([alas, aro, cara, corona]);
    this.tweens.add({targets:angel, alpha:1, y:H*0.29, duration:1400, ease:'Sine.easeOut'});
    this.tweens.add({targets:angel, y:'+=10', duration:2600, yoyo:true, repeat:-1, ease:'Sine.easeInOut'});

    const quien = this.add.text(W/2, H*0.53, 'MAMÁ', {fontFamily:'Impact', fontSize:'15px', color:'#f2c749'})
      .setOrigin(0.5).setScrollFactor(0).setDepth(93);
    const linea = this.add.text(W/2, H*0.63, '', {
      fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'27px', color:'#ffffff',
      align:'center', wordWrap:{width:W-52}, lineSpacing:6
    }).setOrigin(0.5).setScrollFactor(0).setDepth(93);
    const pista = this.add.text(W/2, H-34, 'toca para seguir', {fontFamily:'Arial', fontSize:'11px', color:'#40ada9'})
      .setOrigin(0.5).setScrollFactor(0).setDepth(93).setAlpha(0.7);

    const BEATS = [
      {t:'AY, HIJA...'},
      {t:'LO QUE SUCEDE CONVIENE.'},
      {t:'CONFÍA.'},
      {t:'TOMA ESTO.', espada:true},
      {t:'Y NO LE TIEMBLE\nLA MANO A MI NIÑA.'},
    ];
    let i = -1, reloj = null;
    const cerrar = ()=>{
      if(reloj) reloj.remove();
      this.input.off('pointerdown', pasa);
      this.tweens.add({targets:[angel, halo, velo, quien, linea, pista], alpha:0, duration:900,
        onComplete:()=>[angel,halo,velo,quien,linea,pista].forEach(o=>o.destroy())});
      // y ahora sí: entra la música de pelea y se sale de la cámara lenta poco a poco
      arrancaMusicaPropia(this, 'jefe');
      const cartel = this.add.text(W/2, H*0.42, 'EL CLIENTE IMPOSIBLE', {
        fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'30px', color:'#d83335',
        align:'center', wordWrap:{width:W-40}
      }).setOrigin(0.5).setScrollFactor(0).setDepth(94);
      this.tweens.add({targets:cartel, scale:1.35, alpha:0, duration:1600, onComplete:()=>cartel.destroy()});
      this.time.delayedCall(1500, ()=>{
        this.camaraLenta(false);
        this.physics.resume();
        this.dialogando = false;
      });
    };
    const pasa = ()=>{
      i++;
      if(i >= BEATS.length){ cerrar(); return; }
      const b = BEATS[i];
      linea.setText(b.t).setAlpha(0);
      this.tweens.add({targets:linea, alpha:1, duration:500});
      speakPhrase(b.t.replace(/\n/g,' '));
      if(b.espada) this.entregaEspadaDeFuego();
      if(reloj) reloj.remove();
      reloj = this.time.delayedCall(3600, pasa);   // MUY lento, es lo que pidió
    };
    this.input.on('pointerdown', pasa);
    pasa();
  }

  // la katana se convierte en ESPADA DE FUEGO: se repinta la hoja y le sale llama
  entregaEspadaDeFuego(){
    if(this.espadaFuego) return;
    this.espadaFuego = true;
    const b = this.katanaBlade;
    b.clear();
    b.fillStyle(0xffd34d, 1);  b.fillPoints(this.bladePoly, true);
    b.lineStyle(3, 0xff6a1f, 1); b.strokePoints(this.bladePoly, true);
    b.lineStyle(1.6, 0xffffff, 0.95);
    b.beginPath();
    this.bladePoly.slice(0, 15).forEach((p,i)=> i===0 ? b.moveTo(p.x-1.6,p.y) : b.lineTo(p.x-1.6,p.y));
    b.strokePath();
    // aura de llama alrededor de la hoja, latiendo
    this.llama = this.add.graphics();
    this.llama.fillStyle(0xff7a1f, 0.30);
    this.llama.fillPoints(this.bladePoly.map(p=>({x:p.x*1.9, y:p.y*1.06})), true);
    this.katana.addAt(this.llama, 0);
    this.tweens.add({targets:this.llama, alpha:0.45, scaleX:1.15, duration:280, yoyo:true, repeat:-1});
    // fogonazo y aviso
    this.cameras.main.flash(400, 255, 190, 80);
    const t = this.add.text(W/2, H*0.76, '⚔️ ESPADA DE FUEGO', {
      fontFamily:'Impact', fontSize:'22px', color:'#141617', backgroundColor:'#ffb020',
      padding:{left:12,right:12,top:6,bottom:6}
    }).setOrigin(0.5).setScrollFactor(0).setDepth(95);
    this.tweens.add({targets:t, alpha:0, duration:900, delay:2200, onComplete:()=>t.destroy()});
  }

  construyeMonedas(){
    this.collectibles = this.physics.add.group({ allowGravity:false });
    let n = 0;
    this.segs.forEach((s,si)=>{
      const cuantas = 4;
      for(let k=0;k<cuantas;k++){
        const x = s.x + 60 + (s.w-120) * (k/(cuantas-1));
        // que no caigan encima de los barrotes de la cárcel ni dentro de la celda
        if(this.carcelX !== undefined && x > this.carcelX-200 && x < this.carcelX+170) continue;
        this.spawnCollectible(x, GROUND_Y-60, (n%6===5) ? '⚡' : '🦄');
        n++;
      }
    });
    (this.repisasX||[]).forEach(x=> this.spawnCollectible(x, GROUND_Y-150, '⚡')); // premio de cada repisa alta
  }

  construyeMeta(){
    const s = this.segs[this.segs.length-1];
    const gx = centro(s), gy = GROUND_Y-120;
    this.metaX = gx;
    this.goalZone = this.add.zone(gx, gy, 150, 230);
    this.physics.add.existing(this.goalZone);
    this.goalZone.body.setAllowGravity(false);
    const tipo = this.C.meta.tipo;
    if(tipo === 'contrato'){
      this.add.rectangle(gx-52, gy+10, 96, 130, 0xf3ecd8).setStrokeStyle(3,0x141617).setAngle(-4);
      for(let i=0;i<5;i++) this.add.rectangle(gx-52, gy-32+i*16, 70, 4, 0xbdb190).setAngle(-4);
      this.add.circle(gx-34, gy+48, 13, PALETTE.red,1).setStrokeStyle(2,0x8a0f12);
      this.add.text(gx-52, gy-8, 'FIRMADO', {fontFamily:'Impact', fontSize:'15px', color:'#d83335'}).setOrigin(0.5).setAngle(-16);
    } else if(tipo === 'farolillo'){
      for(let i=0;i<3;i++){
        const fx = gx-70+i*34, c = [PALETTE.pink,PALETTE.yellow,PALETTE.turquoise][i];
        this.add.line(0,0, fx, gy-118, fx, gy-70, 0xf3ecd8).setLineWidth(1.5).setOrigin(0);
        this.add.ellipse(fx, gy-46, 30, 46, c, 0.95).setStrokeStyle(2, 0xf3ecd8);
      }
      this.add.text(gx-36, gy+42, '¡OLÉ!', {fontFamily:'Impact', fontSize:'20px', color:'#f2c749'}).setOrigin(0.5);
    } else if(tipo === 'barra'){
      this.add.rectangle(gx-46, gy+6, 8, 230, 0xdfe6ea);
      this.add.circle(gx-46, gy-104, 16, PALETTE.turquoise, 0.6);

  /* ---------- fondo ---------- */
  drawBackground(){
    const C = this.C, WORLD = this.WORLD;
    // ⚠️ REGLA DEL PARALLAX: un objeto con scrollFactor s solo llega a verse si su x cae dentro de
    // [0, s*(WORLD-W) + W]. Repartir el decorado a lo largo de todo el mundo hacía que la mayor
    // parte NO SE VIERA NUNCA. Este helper coloca n elementos dentro del alcance real.
    const reparte = (n, sf) => {
      const alcance = sf*(WORLD - W) + W;
      return Array.from({length:n}, (_,i)=> 40 + (alcance-80) * (n===1 ? 0.5 : i/(n-1)));
    };
    const g = this.add.graphics();
    g.fillGradientStyle(C.cielo[0],C.cielo[0],C.cielo[1],C.cielo[1],1);
    g.fillRect(0,0,WORLD,H).setScrollFactor(0.1);
    this[{granada_noche:'fondoGranadaNoche', corpus:'fondoCorpus', neon:'fondoNeon',
          calle_dia:'fondoCalleDia', oficina:'fondoOficina'}[C.estilo]](reparte);
    this.fondoMarca(reparte);
  }

  /* ---------- entidades ---------- */
  spawnEnemy(x,y,tipo,min,max){
    const E = ENEMIGOS[tipo];
    const shadow = this.add.ellipse(x,y+38,70,17,0x000000,0.35);
    const label = this.add.text(x,y-70, E.etiqueta, {
      fontFamily:'Impact', fontSize:'13px', color:'#ffffff', backgroundColor: E.color, padding:{left:6,right:6,top:2,bottom:2}
    }).setOrigin(0.5);
    const t = E.cara ? this.add.image(x,y,E.cara).setDisplaySize(76,76)
                     : this.add.text(x,y, E.icono, {fontSize:'70px'}).setOrigin(0.5);
    this.physics.add.existing(t);
    t.body.setAllowGravity(false);
    t.dir = -1; t.min = min; t.max = max; t.type = tipo;
    t.shadow = shadow; t.label = label;
    this.enemies.add(t);
  }

  spawnCollectible(x,y,icon){
    const t = this.add.text(x,y, icon, {fontSize:'26px'}).setOrigin(0.5);
    this.physics.add.existing(t);
    t.body.setAllowGravity(false);
    t.icon = icon;
    this.collectibles.add(t);
    this.physics.add.overlap(this.player, t, ()=>this.collect(t), null, this);
  }

  collect(t){
    if(!t.active) return;
    t.destroy();
    (t.icon==='⚡' ? sfxBonus : sfxCoin)(this);
    this.score += (t.icon==='⚡') ? 2 : 1;
    this.updateHud();
    this.sayPhrase(this.frases[this.phraseIndex % this.frases.length]);
    this.phraseIndex++;
  }

  sayPhrase(text){
    speakPhrase(text);
    const bubble = this.add.text(this.playerVisual.x, this.playerVisual.y - 190, text, {
      fontFamily:'Impact', fontSize:'14px', color:'#141617', backgroundColor:'#f2c749',
      padding:{left:8,right:8,top:4,bottom:4}, align:'center', wordWrap:{width:180}
    }).setOrigin(0.5);
    this.tweens.add({targets:bubble, y:bubble.y-18, alpha:0, duration:1500, delay:500, onComplete:()=>bubble.destroy()});
  }

  /* ---------- combate ---------- */
  onEnemyTouch(en){ if(this.attacking) this.defeatEnemy(en); else this.hitEnemy(en); }

  performAttack(){
    if(this.win || this.lives<=0 || this.attackCooldown) return;
    this.attackCooldown = true;
    this.attacking = true;
    playSwoosh(this);
    const dir = this.player.flipX ? -1 : 1;
    const fx = this.add.graphics();
    fx.lineStyle(8, 0xffffff, 0.95);
    fx.beginPath(); fx.arc(0,0,62, Phaser.Math.DegToRad(-62), Phaser.Math.DegToRad(62), false); fx.strokePath();
    fx.lineStyle(3, PALETTE.turquoise, 0.9);
    fx.beginPath(); fx.arc(0,0,50, Phaser.Math.DegToRad(-52), Phaser.Math.DegToRad(52), false); fx.strokePath();
    fx.setPosition(this.player.x + dir*16, this.player.y - 30);
    fx.setScale(dir*0.55, 0.55);
    this.tweens.add({targets:fx, scaleX:dir*1.2, scaleY:1.2, alpha:0, duration:250, ease:'Cubic.easeOut', onComplete:()=>fx.destroy()});
    this.cameras.main.shake(60, 0.003);
    this.katana.setRotation(Phaser.Math.DegToRad(18));
    this.tweens.add({
      targets:this.katana, rotation:Phaser.Math.DegToRad(-150), duration:140, yoyo:true, ease:'Cubic.easeOut',
      onComplete: ()=> this.katana.setRotation(Phaser.Math.DegToRad(18))
    });
    // el tajo ALCANZA a quien tenga delante: no hace falta chocarse con él
    this.enemies.getChildren().slice().forEach(e=>{
      const dx = (e.x - this.player.x) * dir;
      if(dx > -24 && dx < 96 && Math.abs(e.y - this.player.y) < 90) this.defeatEnemy(e);
    });
    if(this.jefeCuerpo && this.jefeVidas > 0){
      const dx = (this.jefeCuerpo.x - this.player.x) * dir;
      if(dx > -40 && dx < 116) this.golpearJefe();
    }
    if(this.bigote && this.dialogoHecho && !this.carcelAbierta){
      const dx = (this.bigote.x - this.player.x) * dir;
      if(dx > -40 && dx < 122) this.golpearBigote();
    }
    this.time.delayedCall(160, ()=> this.attacking=false);
    this.time.delayedCall(360, ()=> this.attackCooldown=false);
  }

  defeatEnemy(en){
    if(!en.active) return;
    const x=en.x, y=en.y, E = ENEMIGOS[en.type] || {};
    const label = E.servicios
      ? `¡${Phaser.Utils.Array.GetRandom(INSTANTE_SERVICES)} ENTREGADO A TIEMPO!`
      : (E.taunt || '¡FUERA DE AQUÍ!');
    speakPhrase(label);
    playImpact(this);
    en.shadow.destroy(); en.label.destroy(); en.destroy();
    this.score += 2;
    this.updateHud();
    for(let i=0;i<8;i++){
      const p = this.add.rectangle(x,y, 6,6, [PALETTE.yellow,PALETTE.pink,PALETTE.turquoise,0xffffff][i%4]);
      this.tweens.add({targets:p, x:x+Phaser.Math.Between(-50,50), y:y+Phaser.Math.Between(-60,10),
        alpha:0, rotation:Phaser.Math.Between(-4,4), duration:500, onComplete:()=>p.destroy()});
    }
    const t = this.add.text(x, y-30, label, {fontFamily:'Impact', fontSize:'13px', color:'#ffffff', backgroundColor:'#d83335', padding:{left:6,right:6,top:3,bottom:3}}).setOrigin(0.5);
    this.tweens.add({targets:t, y:t.y-24, alpha:0, duration:600, onComplete:()=>t.destroy()});
    const flash = this.add.circle(x, y, 34, 0xffffff, 0.9);
    this.tweens.add({targets:flash, scale:2.1, alpha:0, duration:220, onComplete:()=>flash.destroy()});
    const star = this.add.graphics();
    star.lineStyle(4, PALETTE.yellow, 1);
    for(let a=0;a<4;a++){
      const ang = Phaser.Math.DegToRad(a*45+15);
      star.beginPath(); star.moveTo(Math.cos(ang)*-26, Math.sin(ang)*-26); star.lineTo(Math.cos(ang)*26, Math.sin(ang)*26); star.strokePath();
    }
    star.setPosition(x,y);
    this.tweens.add({targets:star, scale:1.9, alpha:0, duration:300, onComplete:()=>star.destroy()});
    this.cameras.main.shake(150, 0.011);
  }

  golpearJefe(){
    if(this.jefeVidas<=0 || this.jefeInvuln) return;
    this.jefeInvuln = true;
    this.time.delayedCall(420, ()=> this.jefeInvuln=false);
    this.jefeVidas -= this.espadaFuego ? 2 : 1;   // la espada que le dio su madre pega el doble
    if(this.jefeVidas < 0) this.jefeVidas = 0;
    playImpact(this);
    this.cameras.main.shake(180, 0.013);
    this.jefeBarra.setScale(this.jefeVidas/this.C.jefe.vidas, 1);
    this.tweens.add({targets:this.jefeCuerpo, alpha:0.3, duration:90, yoyo:true, repeat:1});
    const brief = Phaser.Utils.Array.GetRandom(BRIEFS_IMPOSIBLES);
    const t = this.add.text(this.jefeCuerpo.x, GROUND_Y-215, `"${brief}"`, {
      fontFamily:'Georgia, serif', fontSize:'12px', color:'#ffffff', backgroundColor:'#d83335',
      padding:{left:7,right:7,top:4,bottom:4}, align:'center', wordWrap:{width:210}, fontStyle:'italic'
    }).setOrigin(0.5);
    this.tweens.add({targets:t, y:t.y-20, alpha:0, duration:1600, delay:600, onComplete:()=>t.destroy()});
    if(this.jefeVidas<=0){
      this.jefeCuerpo.body.enable = false;
      this.jefeLabel.setText('DERROTADO').setBackgroundColor('#40ada9');
      this.jefeBarra.destroy();
      this.tweens.add({targets:this.jefeCuerpo, alpha:0, y:this.jefeCuerpo.y+40, angle:70, duration:700});
      this.sayPhrase('¡El brief me lo paso por el arco del triunfo!');
      this.score += 15; this.updateHud();
    }
  }

  hitEnemy(en){
    if(this.invuln) return;
    this.lives--; this.invuln = true;
    sfxHurt(this);
    this.cameras.main.shake(120, 0.008);
    this.player.setVelocity(this.player.flipX? 160:-160, -260);
    this.time.delayedCall(1200, ()=> this.invuln=false);
    this.updateHud();
    if(this.lives<=0) this.gameOver();
  }

  fallInPit(){
    if(this.invuln || this.win) return;
    this.lives--; this.invuln = true;
    this.player.setPosition(this.respawnX, GROUND_Y-80);
    this.player.setVelocity(0,0);
    this.time.delayedCall(1200, ()=> this.invuln=false);
    this.updateHud();
    if(this.lives<=0) this.gameOver();
  }

  /* ---------- aliada y tutor ---------- */
  conocerAliada(){
    if(this.aliadaUsada) return;
    this.aliadaUsada = true;
    this.score += 3;
    const esConchita = this.aliadaTipo === 'conchita';
    let sub;
    if(esConchita){ this.saltoExtra = true; sub = '¡Salto doble!  ⬆⬆'; }
    else { this.lives = Math.min(4, this.lives+1); sub = 'BRENDA: «¿Qué pasa, chocho?\n¡Vamos a machacarles!»   +1 ❤️'; }
    this.updateHud();
    // lo dice BRENDA, no Aida, y se tiene que ESCUCHAR (pedido de Manuel)
    speakPhrase(esConchita ? '¡Arriba, que tú puedes!' : '¿Qué pasa, chocho? ¡Vamos a machacarles!');
    // ficha de personaje a media pantalla, con su nombre — que se vea quién es
    const card = this.add.container(W/2, H*0.42).setScrollFactor(0).setDepth(70);
    const ring = this.add.circle(0, 0, 64, PALETTE.purple, 1).setStrokeStyle(4, PALETTE.turquoise);
    const cara = this.aliadaCara
      ? this.add.image(0, 0, this.aliadaCara).setDisplaySize(120,120)
      : this.add.text(0, 0, '🤸‍♀️', {fontSize:'70px'}).setOrigin(0.5);
    const nombre = this.add.text(0, 82, this.aliadaNombre, {
      fontFamily:'Impact', fontSize:'26px', color:'#ffffff', backgroundColor:'#68416c', padding:{left:10,right:10,top:3,bottom:3}
    }).setOrigin(0.5);
    const txt = this.add.text(0, 112, sub, {fontFamily:'Arial', fontSize:'14px', color:'#f2c749'}).setOrigin(0.5);
    card.add([ring, cara, nombre, txt]);
    card.setScale(0.4); card.setAlpha(0);
    this.tweens.add({targets:card, scale:1, alpha:1, duration:280, ease:'Back.easeOut'});
    this.tweens.add({targets:card, alpha:0, duration:400, delay:2000, onComplete:()=>card.destroy()});
    // y se queda su chapa en el HUD mientras te acompaña
    if(this.aliadaCara){
      this.add.image(30, 62, this.aliadaCara).setDisplaySize(42,42).setScrollFactor(0).setDepth(60);
    } else {
      this.add.text(30, 62, '🤸‍♀️', {fontSize:'26px'}).setOrigin(0.5).setScrollFactor(0).setDepth(60);
    }
    this.add.circle(30, 62, 23, 0x000000, 0).setStrokeStyle(2, PALETTE.turquoise).setScrollFactor(0).setDepth(60);
    this.add.text(56, 62, 'contigo', {fontFamily:'Impact', fontSize:'11px', color:'#40ada9'}).setOrigin(0,0.5).setScrollFactor(0).setDepth(60);
  }

  meetTutor(){
    if(this.tutorUsed) return;
    this.tutorUsed = true;
    this.physics.pause();
    activeChapter1 = this;
    document.getElementById('thesis-title').textContent = '📚 EL TUTOR';
    document.getElementById('thesis-msg').textContent = 'Para acabar la tesis hace falta un artículo más. Título:';
    const input = document.getElementById('thesis-input');
    input.value = '';
    document.getElementById('thesis-overlay').classList.add('show');
    this.time.delayedCall(50, ()=> input.focus());
  }

  onArticleSubmitted(title){
    this.physics.resume();
    const t = title && title.trim() ? title.trim() : 'Sin título (ya lo pondrás)';
    this.score += 5; this.articulos += 1;
    this.updateHud();
    speakPhrase('¡El revisor lo ha pasado!');
    const msg = this.add.text(this.player.x, this.player.y-190, `📖 "${t}"\n¡El revisor lo ha pasado! ✅`, {

  /* ---------- final de capítulo ---------- */
  reachGoal(){

        this.avisoJefe = true;
        this.sayPhrase('¡Primero el Cliente Imposible!');

      return;

    this.physics.pause();
    progresoGuardar(this.C.n);

    this.add.text(W/2, H*0.39, this.C.meta.grito.toUpperCase(), {fontFamily:'Impact', fontSize:'14px', color:'#e4378c', align:'center', wordWrap:{width:W-60}}).setOrigin(0.5).setScrollFactor(0).setDepth(d);

    this.add.circle(W/2, H*0.585, 45, 0x000000, 0).setStrokeStyle(4, PALETTE.yellow).setScrollFactor(0).setDepth(d);
    this.add.image(W/2, H*0.585, 'aidaFace').setDisplaySize(84,84).setScrollFactor(0).setDepth(d);
    const sig = CAPITULOS[this.C.n]; // el siguiente (n es 1-based, el array 0-based)
    const btn = this.add.text(W/2, H*0.77, sig ? `▶ VOL. ${sig.n} — ${sig.nombre.toUpperCase()}` : '▶ SEGUIR', {

    }).setOrigin(0.5).setScrollFactor(0).setDepth(d).setInteractive({useHandCursor:true});
    btn.on('pointerdown', ()=> sig ? this.scene.start('Interludio', {tras:this.C.n, key:sig.key}) : this.scene.start('Menu'));
    const men = this.add.text(W/2, H*0.87, 'elegir capítulo', {fontFamily:'Arial', fontSize:'12px', color:'#40ada9'})

  gameOver(motivo){
    this.physics.pause();
    this.add.rectangle(W/2, H/2, W, H, 0x0c0d0e, 0.9).setScrollFactor(0).setDepth(80);
    this.add.text(W/2, H*0.42, motivo || '¡CASI!', {fontFamily:'Impact', fontSize:'27px', color:'#d83335', align:'center', wordWrap:{width:W-40}}).setOrigin(0.5).setScrollFactor(0).setDepth(81);
    const btn = this.add.text(W/2, H*0.56, '🔄 REINTENTAR', {fontFamily:'Arial', fontSize:'18px', color:'#141617', backgroundColor:'#f2c749', padding:{left:16,right:16,top:8,bottom:8}}).setOrigin(0.5).setScrollFactor(0).setDepth(81).setInteractive({useHandCursor:true});

    men.on('pointerdown', ()=> this.scene.start('Menu'));
  }

  updateHud(){
    const t = this.C.tiempo ? `   ⏱ ${Math.max(0,this.restante)}s` : '';
    const a = this.articulos ? `   📖 ${this.articulos}` : '';
    this.hud.setText(`♥ ${'❤'.repeat(Math.max(0,this.lives))}   🦄 ${this.score}${a}${t}`);
  }

  /* ---------- bucle ---------- */
  update(){
    if(this.win || this.lives<=0) return;
    if(this.dialogando) return;   // durante el diálogo de la cárcel no se juega: la escena manda
    const speed = this.C.tiempo ? 240 : 200; // en la contrarreloj corre más
    if(keys.left){ this.player.setVelocityX(-speed); this.player.flipX = true; }
    else if(keys.right){ this.player.setVelocityX(speed); this.player.flipX = false; }
    const enSuelo = this.player.body.blocked.down || this.player.body.touching.down;
    if(enSuelo) this.saltosDados = 0;
    // FALLO CAZADO EN LA REVISIÓN: al caminar por el borde de una plataforma, saltosDados se
    // quedaba en 0 y quedaba un salto de regalo EN EL AIRE (dos en La Barra). Los pozos dejaban
    // de dar miedo. Al dejar el suelo sin haber saltado, ese salto se da por gastado.
    else if(this.saltosDados === 0) this.saltosDados = 1;
    // trampolines de La Barra: si aterrizas encima de una, sales disparada
    if(enSuelo && this.trampolines && this.trampolines.length){
      const sobre = this.trampolines.some(tx => Math.abs(this.player.x - tx) < 74)
                    && this.player.y < GROUND_Y - 90;
      if(sobre && !this.reboteEspera){
        this.reboteEspera = true;
        this.player.setVelocityY(-820);
        sfxJump(this);
        this.time.delayedCall(400, ()=> this.reboteEspera=false);
      }
    }
    if(jumpRequested){
      const maxSaltos = this.saltoExtra ? 2 : 1; // el salto doble lo regala Conchita
      if(enSuelo || this.saltosDados < maxSaltos){
        this.player.setVelocityY(-640);
        sfxJump(this);
        this.saltosDados = enSuelo ? 1 : this.saltosDados+1;
      }
      jumpRequested = false;
    }
    if(attackRequested){ this.performAttack(); attackRequested = false; }
    // la katana también se acciona SOLA si un malo se pone a tiro
    if(!this.attackCooldown){
      let cerca = this.enemies.getChildren().find(e =>
        Math.abs(e.x - this.player.x) < 92 && Math.abs(e.y - this.player.y) < 90);
      // FALLO CAZADO EN LA REVISIÓN: la katana se accionaba sola contra los enemigos normales
      // pero NO contra el Bigote ni contra el Cliente Imposible — y ninguno de los dos se puede
      // esquivar. Aida, que no juega a videojuegos, podía morir ahí sin entender que había que
      // pulsar TAJO. Ahora también se acciona sola contra ellos (el botón sigue estando).
      if(!cerca && this.bigote && this.dialogoHecho && !this.carcelAbierta &&
         Math.abs(this.bigote.x - this.player.x) < 104) cerca = this.bigote;
      if(!cerca && this.jefeCuerpo && this.jefeVidas > 0 &&
         Math.abs(this.jefeCuerpo.x - this.player.x) < 104) cerca = this.jefeCuerpo;
      if(cerca){ this.player.flipX = cerca.x < this.player.x; this.performAttack(); }
    }
    if(enSuelo){
      const seg = this.segs.find(s=> this.player.x >= s.x+30 && this.player.x <= s.x+s.w-30);
      if(seg) this.respawnX = Phaser.Math.Clamp(this.player.x, seg.x+40, seg.x+seg.w-40);
    }
    if(this.player.y > GROUND_Y + 50) this.fallInPit();

    this.playerVisual.x = this.player.x;
    this.playerVisual.y = this.player.y;
    this.heroImage.setFlipX(this.player.flipX);
    this.logoBadge.x = this.player.flipX ? -7 : 7;
    this.katana.x = this.player.flipX ? -31 : 31;
    this.katana.setScale(this.player.flipX ? -1 : 1, 1);

    this.enemies.getChildren().forEach(e=>{
      e.x += e.dir * (ENEMIGOS[e.type] ? ENEMIGOS[e.type].vel : 0.7);
      if(e.x<e.min){ e.x=e.min; e.dir=1; }
      if(e.x>e.max){ e.x=e.max; e.dir=-1; }
      e.setFlipX(e.dir>0);
      e.shadow.x = e.x; e.label.x = e.x;
    });

    // el jefe te persigue de lado a lado de su tramo
    if(this.jefeCuerpo && this.jefeVidas > 0){
      const dx = this.player.x - this.jefeCuerpo.x;
      this.jefeCuerpo.x += Phaser.Math.Clamp(dx, -1.5, 1.5);
      this.jefeLabel.x = this.jefeCuerpo.x;
      this.jefeBarra.x = this.jefeCuerpo.x - 60;
    }

    // la aliada, ya unida: te sigue y se pone a pelear
    if(this.aliadaUsada && this.aliada){
      const targetX = this.player.x + (this.player.flipX ? 70 : -70);
      this.aliada.x += (targetX - this.aliada.x) * 0.06;
      if(this.aliada.setFlipX) this.aliada.setFlipX(this.player.flipX);
      this.aliadaLabel.x = this.aliada.x;
      this.aliadaShadow.x = this.aliada.x;
      if(this.aliadaMueble) this.aliadaMueble.x = this.aliada.x;
      if(!this.aliadaCooldown){
        const target = this.enemies.getChildren().find(e => Math.abs(e.x-this.aliada.x) < 55);
        if(target){
          this.defeatEnemy(target);
          this.aliadaCooldown = true;
          this.time.delayedCall(450, ()=> this.aliadaCooldown=false);
        }
      }
    }
  }
}

class Interludio extends Phaser.Scene {
  constructor(){ super('Interludio'); }

  create(){
    this.cameras.main.setBackgroundColor('#0c0d0e');
    paraMusicaPropia();
    const cartelas = INTERLUDIOS[this.tras] || [];
    this.i = -1;
    this.gr = this.add.text(W/2, H*0.40, '', {

    this.reloj = this.time.delayedCall(3400, ()=> this.pasa(cartelas));  // lento, que se lea

  alSiguiente(){
    if(this.reloj) this.reloj.remove();
    this.scene.start('Title', {key: this.siguienteKey});

/* ---------- CONTROLES ---------- */
function wireHold(id, onDown, onUp){
  const btn = document.getElementById(id);
  const down = ev=>{ ev.preventDefault(); onDown(); };
  const up = ()=>{ onUp && onUp(); };
  btn.addEventListener('touchstart', down, {passive:false});
  btn.addEventListener('mousedown', down);
  ['touchend','touchcancel'].forEach(e=>btn.addEventListener(e, up));
  ['mouseup','mouseleave'].forEach(e=>btn.addEventListener(e, up));
}
wireHold('btnLeft', ()=>keys.left=true, ()=>keys.left=false);
wireHold('btnRight', ()=>keys.right=true, ()=>keys.right=false);
wireHold('jump-btn', ()=>jumpRequested=true);
wireHold('attack-btn', ()=>attackRequested=true);

document.getElementById('mute-btn').addEventListener('click', toggleMute);

function submitArticle(){
  const overlay = document.getElementById('thesis-overlay');
  const input = document.getElementById('thesis-input');
  overlay.classList.remove('show');
  if(activeChapter1) activeChapter1.onArticleSubmitted(input.value);
}
document.getElementById('thesis-submit').addEventListener('click', submitArticle);
document.getElementById('thesis-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') submitArticle();
  e.stopPropagation(); // que las letras no se cuelen como controles del juego
});

// TECLADO. El tajo de la katana tiene MUCHAS teclas a propósito: Manuel pidió expresamente
// "poder darle a la katana con una tecla del teclado" y lo importante es que le valga la que pulse,
// no que acierte con la correcta. Están las de toda la vida (X, Z, Ctrl) más ENTER, MAYÚS,
// la A y la flecha ABAJO. Las teclas del juego cancelan el scroll de la página.
const TECLAS_TAJO = ['x','X','z','Z','a','A','Control','Shift','Enter','ArrowDown'];
document.addEventListener('keydown', e=>{
  if(e.repeat) return; // que mantener pulsado no dispare cien tajos
  if(e.key==='ArrowLeft') keys.left=true;
  if(e.key==='ArrowRight') keys.right=true;
  if(e.key==='ArrowUp' || e.key===' ') jumpRequested=true;
  if(TECLAS_TAJO.includes(e.key)) attackRequested=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft') keys.left=false;
  if(e.key==='ArrowRight') keys.right=false;
});

// PWA: ya se puede instalar en el móvil, con su icono. El sw.js es NETWORK-FIRST para el HTML
// (ver el comentario de arriba del propio sw.js): la página se pide siempre a la red, así que
// NO puede volver el problema de ver versiones viejas. Solo las fotos y el audio van de caché.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

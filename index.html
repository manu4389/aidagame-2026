<style>
  :root{
    --turquoise:#40ada9; --pink:#e4378c; --yellow:#f2c749; --purple:#68416c; --red:#d83335;
    --ink:#141617;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;background:#0c0d0e;
    font-family:'Arial Narrow',Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;touch-action:none;user-select:none;
  }
  /* ANTES: #game-holder tenía aspect-ratio fijo por ANCHO, sin mirar la altura real de la
     pantalla — en un móvil con poca altura visible (barra del navegador, etc.) esto podía
     empujar los controles (el botón TAJO) fuera de la pantalla, invisibles, sin poder
     hacer scroll (body tiene overflow:hidden). Ahora #wrap ocupa la altura real del
     viewport y #game-holder se queda con lo que sobra — los controles SIEMPRE caben. */
  #wrap{
    position:relative;width:min(420px,100vw);
    height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
  }
  #marquee{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;
    padding:8px 0;background:linear-gradient(180deg,#241014,#0c0d0e);
    border:2px solid var(--yellow);border-bottom:none;border-radius:10px 10px 0 0;
  }
  #marquee img{width:26px;height:17px;filter:drop-shadow(0 0 4px rgba(64,173,169,.8));}
  #marquee span{font-family:'Impact',Arial Narrow,sans-serif;font-size:13px;letter-spacing:1px;color:var(--yellow);text-shadow:0 0 6px rgba(242,199,73,.6);}
  /* flex:1 + min-height:0 = se queda con la altura que sobre, NUNCA empuja los controles fuera */
  #game-holder{
    width:100%;flex:1;min-height:0;position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.5);
    border:5px solid var(--ink);border-top:none;border-bottom:none;
    background:#000;
  }
  #controls{
    display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
    width:100%;padding:12px 16px;background:#0c0d0e;
    border:2px solid var(--yellow);border-top:none;border-radius:0 0 10px 10px;
  }
  #move-btns{display:flex;gap:10px;}
  .ctrl{
    background:linear-gradient(145deg,#26282b,#141617);
    border:2px solid var(--yellow);border-radius:14px;
    color:var(--yellow);font-size:24px;width:56px;height:54px;
    box-shadow:0 3px 0 #000;
  }
  .ctrl:active{transform:translateY(2px);box-shadow:0 1px 0 #000;}
  #jump-btn{
    background:linear-gradient(145deg,var(--yellow),#c99a1f);
    border:2px solid #fff8d0;border-radius:50%;
    color:#2a1e00;font-size:12px;font-weight:900;
    width:64px;height:64px;box-shadow:0 4px 0 #8a6a10;
  }
  #jump-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a10;}
  #attack-btn{
    background:linear-gradient(145deg,var(--red),#8f1417);
    border:3px solid #ffd7d7;border-radius:50%;
    color:#fff;font-size:15px;font-weight:900;line-height:1.05;
    width:78px;height:78px;box-shadow:0 4px 0 #5c0d0f;
    margin-right:8px;
  }
  #attack-btn small{display:block;font-size:9px;font-weight:700;opacity:.85;letter-spacing:.5px;}
  #attack-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5c0d0f;}
  #mute-btn{
    position:absolute;top:8px;right:8px;z-index:10;
    width:34px;height:34px;border-radius:50%;
    background:rgba(12,13,14,.7);border:2px solid var(--yellow);
    color:var(--yellow);font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  #thesis-overlay{
    position:absolute;inset:0;z-index:20;display:none;
    background:rgba(6,7,8,.94);flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  #thesis-overlay.show{display:flex;}
  #thesis-overlay h3{font-family:Impact,Arial Narrow,sans-serif;color:var(--yellow);font-size:18px;margin:0 0 8px;}
  #thesis-overlay p{font-family:Georgia,serif;color:#fff;font-size:13px;line-height:1.5;margin:0 0 16px;}
  #thesis-input{
    width:90%;padding:10px;border-radius:8px;border:2px solid var(--turquoise);
    background:#141617;color:#fff;font-size:14px;text-align:center;margin-bottom:14px;
  }

    font-family:Impact,Arial Narrow,sans-serif;font-size:15px;color:#141617;
  }

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════
   AIDA — Vol. 1: La Ola
   Motor: Phaser 3 (Arcade Physics)
   ════════════════════════════════════════════════════════ */
const PALETTE = { turquoise:0x40ada9, pink:0xe4378c, yellow:0xf2c749, purple:0x68416c, red:0xd83335, ink:0x141617 };
const W = 378, H = 546; // 9:13-ish, escala con CSS

const keys = { left:false, right:false };
let activeChapter1 = null; // referencia a la escena activa, para que el overlay HTML del tutor pueda avisarla
let jumpRequested = false;
let attackRequested = false;

/* ---------- VOZ — que lo diga en voz alta, con la voz española que haya en el dispositivo ---------- */
// Aviso honesto: el navegador NO tiene voces regionales (andaluza vs. "neutra") — solo elige
// entre las voces "es-ES"/"es" que traiga instalado el propio móvil/ordenador de Manuel.
// No hay manera de forzar acento andaluz específico desde aquí, solo español de España si existe.
let spanishVoice = null;
function pickSpanishVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  spanishVoice = voices.find(v=>v.lang==='es-ES') || voices.find(v=>v.lang && v.lang.startsWith('es')) || null;
}
if('speechSynthesis' in window){
  pickSpanishVoice();
  window.speechSynthesis.onvoiceschanged = pickSpanishVoice;
}
function speakPhrase(text){
  if(!('speechSynthesis' in window) || isMuted) return;
  const clean = text.replace(/[¡!¿?"]/g,'');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'es-ES'; u.rate = 1.02; u.pitch = 1.1;
  if(spanishVoice) u.voice = spanishVoice;
  window.speechSynthesis.cancel(); // que no se amontonen frases
  window.speechSynthesis.speak(u);
}

/* ---------- SONIDO DE ESPADA (sintetizado, sin licencias de por medio) ---------- */
function playSwoosh(scene){
  const ctx = scene.sound.context;
  if(!ctx || isMuted) return;
  const dur = 0.22;
  const buffer = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(2600, ctx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(500, ctx.currentTime+dur);
  filter.Q.value = 1.1;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.85, ctx.currentTime); // subido de 0.5 — Manuel: "que se oiga mejor la lucha"
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start();
  // "clang" agudo justo detrás del silbido, para el golpe seco tipo katana
  const clang = ctx.createOscillator();
  clang.type = 'triangle'; clang.frequency.setValueAtTime(1800, ctx.currentTime+0.03);
  clang.frequency.exponentialRampToValueAtTime(300, ctx.currentTime+0.14);
  const clangGain = ctx.createGain();
  clangGain.gain.setValueAtTime(0.6, ctx.currentTime+0.03); // subido de 0.35
  clangGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.16);
  clang.connect(clangGain); clangGain.connect(ctx.destination);
  clang.start(ctx.currentTime+0.03); clang.stop(ctx.currentTime+0.16);
}

/* ---------- GOLPE QUE ATERRIZA (impacto seco y grave, para que el tajo SUENE a que ha dado) ---------- */
function playImpact(scene){
  const ctx = scene.sound.context;
  if(!ctx || isMuted) return;
  const t0 = ctx.currentTime;
  // golpe grave
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(190, t0);
  osc.frequency.exponentialRampToValueAtTime(48, t0+0.20);
  const g1 = ctx.createGain();
  g1.gain.setValueAtTime(0.9, t0);
  g1.gain.exponentialRampToValueAtTime(0.001, t0+0.24);
  osc.connect(g1); g1.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+0.25);
  // chasquido corto encima, para que se note el corte
  const dur = 0.09;
  const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g2 = ctx.createGain();
  g2.gain.setValueAtTime(0.55, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(g2); g2.connect(ctx.destination);
  src.start(t0);
}

/* ---------- BLIPS DE ARCADE (moneda, salto, daño) — "tienen que sonar también" ---------- */
function playBlip(scene, f0, f1, dur, type, vol){
  const ctx = scene.sound.context;
  if(!ctx || isMuted) return;
  const t0 = ctx.currentTime;
  const o = ctx.createOscillator();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol || 0.3, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const sfxCoin  = s => playBlip(s, 620, 1250, 0.14, 'triangle', 0.32);
const sfxBonus = s => playBlip(s, 780, 1700, 0.20, 'square',   0.26);
const sfxJump  = s => playBlip(s, 300,  660, 0.13, 'triangle', 0.26);
const sfxHurt  = s => playBlip(s, 400,   90, 0.30, 'sawtooth', 0.34);

/* ---------- MÚSICA ---------- */
let currentMusic = null;
let isMuted = false;
function playMusic(scene, key, opts){
  opts = opts || {};
  const loop = opts.loop !== undefined ? opts.loop : true;
  const volume = opts.volume !== undefined ? opts.volume : 0.45;
  if(currentMusic) currentMusic.stop();
  currentMusic = scene.sound.add(key, {loop, volume: isMuted ? 0 : volume});
  currentMusic.baseVolume = volume;
  currentMusic.play();
  return currentMusic;
}
function toggleMute(){
  isMuted = !isMuted;
  if(currentMusic) currentMusic.setVolume(isMuted ? 0 : currentMusic.baseVolume);
  document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
}

/* ---------- BOOT / PRELOAD ---------- */

    this.load.image('aidaHeroReal', 'fotos/aida_hero_real.png'); // ELLA TAL CUAL — recorte real de cuerpo entero (IA de segmentación, rembg/u2net), sin dibujo vectorial de por medio
    this.load.image('brendaHeroReal', 'fotos/brenda_hero_real.png'); // Brenda, por fin con su foto real (Manuel la dejó en fotos/ el 25 jul) — mismo proceso: rembg + u2net_human_seg + crop
    this.load.image('brendaFace', 'fotos/brenda_face.png'); // SU CARA, recortada en redondo con borde difuminado — para que se le vea de verdad, no de lejos
    this.load.image('ojosInstante', 'fotos/instante_ojos_tile.png'); // mosaico del ojo de la marca, con el blanco pasado a transparente, para el fondo del nivel
    // caras de enemigos "más fuertes" — generadas (Pollinations) + recortadas (rembg), pedido explícito de Manuel

    this.load.image('enemyMachirulo2', 'fotos/enemy_machirulo2.png');
    this.load.image('enemyViejo', 'fotos/enemy_viejo.png');
    this.load.image('aidaGoal', 'fotos/aida_portada.jpg');     // cuerpo entero, para la revelación final — SIN recortar en círculo, se ve entera
    this.load.image('instanteLogo', 'fotos/instante_logo.png'); // el logo REAL de Instante (el ojo), sacado de agenciainstante.com
    this.load.audio('marchIntro', ['audio/march_intro.mp3']); // fanfarria Marcha Triunfal de Aida (Verdi) — dominio público, US Marine Band
    this.load.audio('tension', ['audio/tension_western.mp3']); // "In The West" — Kevin MacLeod (incompetech.com), CC BY 4.0 — silbido de spaghetti western, la raíz musical del propio Kill Bill
  }
  create(){
    this.scene.start('Intro');
  }
}

/* ---------- NARRATIVA INICIAL — cartelas al estilo Tarantino, su vida real ---------- */
const INTRO_BEATS = [
  { big:'GRANADA.', small:'19 de agosto.' },
  { big:'AIDA MOLINA PRADOS', small:'cumple 33.' },
  { big:'HA REMADO', small:'en Ori Surf School,\nha corrido kilómetros,\nse ha subido a una barra con Conchita,\ny se ha puesto el traje de flamenca cada Corpus.' },
  { big:'HA ESTADO', small:'en Lisboa, en París, en Bali...\ny en Berlín, dos veces,\ncon 12 años de diferencia.' },
  { big:'UNA VEZ', small:'tocó rock and roll con su hermano.' },
  { big:'FUNDÓ INSTANTE', small:'con Brenda.\nSu lema: "No se brilla sin oscuridad."' },
  { big:'PERO HAY UN PROBLEMA', small:'la competencia quiere cerrar Instante.\nVan detrás de todo lo que ha montado con Brenda.' },
  { big:'ADEMÁS', small:'el tutor le pide un artículo más\npara terminar la tesis.\nEsto va a ser de todo, menos tranquilo.' },
  { big:'ESCRITO POR', small:'MANUEL MOLINA PRADOS', tarantino:true, smallSize:'24px' },
  { big:'DIRIGIDO POR', small:'QUENTIN TARANTINO', tarantino:true },
];
class Intro extends Phaser.Scene {
  constructor(){ super('Intro'); }
  create(){
    this.cameras.main.setBackgroundColor('#0c0d0e');
    // música desde el primer cartel — los navegadores BLOQUEAN el audio hasta el primer toque
    // (por eso "seguía sin sonar": el create() se ejecuta solo, sin ningún toque todavía)
    if(this.sound.locked){
      this.sound.once(Phaser.Sound.Events.UNLOCKED, ()=> playMusic(this, 'tension', {loop:true, volume:0.35}));
    } else {
      playMusic(this, 'tension', {loop:true, volume:0.35});
    }
    this.i = 0;
    this.cx = W/2; this.cy = H/2;
    this.bigText = this.add.text(this.cx, this.cy-18, '', {
      fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'34px', color:'#f2c749', align:'center', wordWrap:{width:W-50}
    }).setOrigin(0.5).setAlpha(0);
    this.smallText = this.add.text(this.cx, this.cy+56, '', {
      fontFamily:'Georgia, serif', fontSize:'15px', color:'#ffffff', align:'center', lineSpacing:6, wordWrap:{width:W-70}
    }).setOrigin(0.5).setAlpha(0);
    this.hint = this.add.text(this.cx, H-24, 'toca para seguir', {
      fontFamily:'Arial', fontSize:'12px', color:'#40ada9'
    }).setOrigin(0.5).setAlpha(0.7);
    this.skip = this.add.text(W-10, 10, 'saltar ›', {fontFamily:'Arial', fontSize:'12px', color:'#68416c'})
      .setOrigin(1,0).setInteractive({useHandCursor:true});
    this.skip.on('pointerdown', ()=> this.goTitle());
    this.input.on('pointerdown', (p)=>{ if(p.y < H-40) this.next(); });
    this.showBeat();
  }
  showBeat(){
    const b = INTRO_BEATS[this.i];
    this.bigText.setText(b.big).setFontSize(b.tarantino ? '22px':'34px').setColor(b.tarantino ? '#ffffff':'#f2c749');
    this.smallText.setText(b.small).setFontSize(b.smallSize || (b.tarantino ? '30px':'15px')).setColor(b.tarantino ? '#f2c749':'#ffffff')
      .setFontFamily(b.tarantino ? 'Impact, Arial Narrow, sans-serif':'Georgia, serif');
    this.bigText.setAlpha(0); this.smallText.setAlpha(0);
    this.tweens.add({targets:[this.bigText,this.smallText], alpha:1, duration:500});
  }
  next(){
    if(this.i >= INTRO_BEATS.length-1){ this.goTitle(); return; }
    this.tweens.add({targets:[this.bigText,this.smallText], alpha:0, duration:250, onComplete:()=>{
      this.i++; this.showBeat();
    }});
  }
  goTitle(){
    this.scene.start('Title', {chapter:1, name:'El Contrato', sub:'que no se te escape entre papeleo y machirulos'});
  }
}

/* ---------- CARTELA DE CAPÍTULO (estilo Tarantino) ---------- */

    this.add.circle(cx, H*0.26, 112, 0, 0).setStrokeStyle(6, 0xf2c749);

    this.add.image(cx, H*0.385, 'instanteLogo').setDisplaySize(56,36).setAlpha(0.95);

    this.add.text(cx, H*0.545, `VOL. ${this.data.get('chapter')} — ${this.data.get('name').toUpperCase()}`, {

    btn.on('pointerdown', ()=> {
      playMusic(this, 'marchIntro', {loop:false, volume:0.8}); // fanfarria de Verdi al arrancar
      this.scene.start('Chapter1');
    });
  }
}

/* ---------- VOL. 1 — EL CONTRATO ---------- */
// Nivel ALARGADO (2600 → 3600) para que los encuentros respiren — Manuel: "demasiado saturado de enemigos".
// ⚠️ Si se vuelve a tocar WORLD_W hay que mover A LA VEZ: segs, los 6 spawnEnemy, brenda, tutor, coinXs y goalZone.
const WORLD_W = 3600, GROUND_Y = 460;
const ENEMY_ICON = { burocracia:'📋', machirulo:'🕴️', chirulo_viejo:'🧔' };
// frases suyas de verdad (BRIEF.md) + las nuevas que pidió Manuel — saltan al azar al coger un ⚡
// servicios REALES de Instante (agenciainstante.com) — para que la burocracia derrotada los nombre, no un genérico "papeleo"
const INSTANTE_SERVICES = [
  'REDES SOCIALES', 'DISEÑO WEB', 'INFLUENCER MARKETING', 'DISEÑO GRÁFICO',
  'CAMPAÑAS SEM', 'KIT DIGITAL', 'ESTUDIOS DE MERCADO',
];
const CATCHPHRASES = [
  '¡Hoy se cena en vaso!',
  '¡Y olé, olé, los caracoles!',
  '¡Lo que sucede conviene, los cojones!',
  '¡Qué arte, mi coño moreno!',
  '¡Muerte a los caraduras!',
  '¡Poco para los que no lo merecemos!',
];

class Chapter1 extends Phaser.Scene {
  constructor(){ super('Chapter1'); }

  create(){
    this.physics.world.setBounds(0,0,WORLD_W,H);
    this.cameras.main.setBounds(0,0,WORLD_W,H);
    this.cameras.main.setBackgroundColor('#2a0f10');

    this.score = 0; this.lives = 3; this.attacking = false; this.articulos = 0; this.phraseIndex = 0;
    this.drawBackground();

    // tras la fanfarria de Verdi, entra el silbido de spaghetti western (la raíz musical de Kill Bill)
    this.time.delayedCall(8500, ()=>{ if(this.sys.isActive()) playMusic(this, 'tension', {loop:true, volume:0.7}); });
    // frase de apertura — que se la oiga hablar desde el minuto uno, no solo al coger cosas
    this.time.delayedCall(1800, ()=>{ if(this.sys.isActive()) this.sayPhrase(CATCHPHRASES[0]); this.phraseIndex = 1; });

    this.platforms = this.physics.add.staticGroup();
    // 7 tramos hasta 3600, con huecos de 100px (el salto llega a ~136px de alto y ~187px de largo: se pasan de sobra)
    const segs = [
      {x:0,w:520}, {x:620,w:460}, {x:1180,w:480}, {x:1760,w:460}, {x:2320,w:480}, {x:2900,w:340}, {x:3340,w:260},
    ];
    this.segs = segs;
    segs.forEach(s=>{
      const p = this.add.rectangle(s.x + s.w/2, GROUND_Y+30, s.w, 60, 0x8a7256);
      this.physics.add.existing(p, true);
      this.platforms.add(p);
      const edge = this.add.rectangle(s.x + s.w/2, GROUND_Y, s.w, 8, 0xc9a86b);
    });
    // pequeña plataforma elevada con bonus
    const ledge = this.add.rectangle(780, GROUND_Y-110, 140, 24, 0x8a7256);
    this.physics.add.existing(ledge, true);
    this.platforms.add(ledge);

    // jugador
    this.player = this.physics.add.sprite(80, GROUND_Y-110, null);
    this.player.body.setSize(55,140).setOffset(-27,-98); // reducida OTRA VEZ (sigue "demasiado grande" según Manuel) + zoom de cámara bajado
    this.player.setCollideWorldBounds(true);
    this.player.setMaxVelocity(220, 900);
    this.player.setDragX(1200);

    // ELLA TAL CUAL — foto real de cuerpo entero, recortada con IA de segmentación (rembg/u2net), sin dibujo vectorial
    this.heroImage = this.add.image(0,-33,'aidaHeroReal').setDisplaySize(84,150);
    // el logo REAL de Instante — más grande, en el pecho, para que se lea de verdad
    this.logoBadge = this.add.image(8,-33,'instanteLogo').setDisplaySize(30,19);
    // Medido a ojo sobre `fotos/aida_hero_real.png` directamente (no por proporción de otra foto):
    // sus manos quedan a la altura de las bocamangas del mantón, ~y=-28 en este contenedor,
    // mano derecha (de ella) hacia x=+28, mano izquierda hacia x=-25.
    // KATANA en la mano derecha — puño + guarda (tsuba) + hoja colgando, para que SE LEA como espada de verdad
    // el contenedor va EN la mano (28,-28) y las piezas cuelgan de ahí en local — así al rotar
    // gira alrededor de la muñeca de verdad, no alrededor del centro del cuerpo (por eso "no era orgánico")
    // KATANA DE VERDAD, no un palo: hoja CURVA (sori) que se afina, punta en diagonal (kissaki),
    // línea de temple (hamon), guarda redonda (tsuba) y empuñadura trenzada (tsuka).
    // Manuel: "no parece una katana" — un rectángulo con guarda no lo parecía, esto sí.
    const BL = 80, BN = 14, SORI = 13; // largo, nº de tramos de la curva, cuánto se curva
    const bladeEdge = [], bladeBack = [];
    for(let i=0;i<=BN;i++){
      const t = i/BN, y = 6 + BL*t;
      const off = SORI*t*t;                 // la curva: nada al salir de la guarda, mucha en la punta
      const hw = 4.2*(1 - 0.35*t*t);        // se va afinando
      bladeEdge.push({x: off+hw, y});
      bladeBack.push({x: off-hw, y});
    }
    const bladePoly = bladeEdge.concat([{x: SORI+2.5, y: 6+BL+9}], bladeBack.slice().reverse());
    this.katanaBlade = this.add.graphics();
    this.katanaBlade.fillStyle(0xe8eef2,1); this.katanaBlade.fillPoints(bladePoly, true);
    this.katanaBlade.lineStyle(1.4,0x8f9ba1,1); this.katanaBlade.strokePoints(bladePoly, true);
    this.katanaBlade.lineStyle(1.2,0xffffff,0.8); // hamon
    this.katanaBlade.beginPath();
    for(let i=0;i<=BN;i++){
      const t = i/BN, y = 6 + BL*t;
      const x = SORI*t*t + 4.2*(1-0.35*t*t) - 1.6 + Math.sin(t*9)*0.7;
      if(i===0) this.katanaBlade.moveTo(x,y); else this.katanaBlade.lineTo(x,y);
    }
    this.katanaBlade.strokePath();
    this.katanaHilt = this.add.graphics();
    this.katanaHilt.fillStyle(0x141617,1); this.katanaHilt.fillRoundedRect(-4.5,-19,9,22,3);
    this.katanaHilt.lineStyle(1,0xb99a44,0.9); // trenzado del puño
    for(let i=0;i<4;i++){ this.katanaHilt.beginPath(); this.katanaHilt.moveTo(-4.5,-16+i*5); this.katanaHilt.lineTo(4.5,-13+i*5); this.katanaHilt.strokePath(); }
    this.katanaHilt.fillStyle(0xb99a44,1); this.katanaHilt.fillRect(-5.5,-20.5,11,3); // kashira (pomo)
    this.katanaHilt.fillStyle(PALETTE.yellow,1); this.katanaHilt.fillEllipse(0,4,20,7); // tsuba
    this.katanaHilt.lineStyle(1.2,0x141617,1); this.katanaHilt.strokeEllipse(0,4,20,7);
    this.katana = this.add.container(28,-28,[this.katanaBlade,this.katanaHilt]);
    this.katana.setRotation(Phaser.Math.DegToRad(8));
    // CIGARRILLO en la mano izquierda — NO en la cara (tapaba la cara)
    this.cigBody = this.add.rectangle(-25,-28,16,4,0xf3ecd8,1).setStrokeStyle(1,0xcfc7ab).setAngle(-12);
    this.cigEmber = this.add.circle(-18,-30,2.4,PALETTE.red,1);
    this.cigSmoke = this.add.ellipse(-17,-40,8,12,0xcccccc,0.35);
    this.playerVisual = this.add.container(this.player.x, this.player.y,
      [this.heroImage, this.logoBadge, this.katana, this.cigSmoke, this.cigBody, this.cigEmber]);

    this.physics.add.collider(this.player, this.platforms);

    // enemigos: burocracia (papeleo) y machirulos (jefazos con aires) — se cargan con la katana, no se esquivan
    this.enemies = this.physics.add.group({ allowGravity:false, immovable:true });
    // los mismos 6, pero repartidos por un mundo 1000px más largo: uno por tramo, sin amontonarse
    this.spawnEnemy(900, GROUND_Y-40, 'burocracia', 760, 1040);
    this.spawnEnemy(1470, GROUND_Y-40, 'chirulo_viejo', 1340, 1600, 'enemyViejo');
    this.spawnEnemy(2000, GROUND_Y-40, 'machirulo', 1820, 2160, 'enemyMachirulo1');
    this.spawnEnemy(2450, GROUND_Y-40, 'burocracia', 2380, 2560);
    this.spawnEnemy(2700, GROUND_Y-40, 'machirulo', 2600, 2760, 'enemyMachirulo2');
    this.spawnEnemy(3060, GROUND_Y-40, 'chirulo_viejo', 2960, 3180, 'enemyViejo');

    this.physics.add.overlap(this.player, this.enemies, (pl,en)=>this.onEnemyTouch(en), null, this);

    // Brenda — su mejor amiga y socia. Se une como aliada QUE TAMBIÉN PELEA, no solo anima
    // (pendiente: Manuel va a pasar una foto real suya para sustituir este emoji, igual que se hizo con Aida)
    // ✅ 25 jul: ya NO es un emoji — es Brenda de verdad (Manuel confirmó que es la del pelo oscuro
    // liso y el vestido gris; la otra foto de esa pareja es Aida). Recorte con rembg/u2net_human_seg.
    this.brendaShadow = this.add.ellipse(1250, GROUND_Y-2, 74, 17, 0x000000, 0.35);
    this.brenda = this.add.image(1250, GROUND_Y-84, 'brendaHeroReal').setDisplaySize(92,169); // más grande: que se le vea la cara
    this.brendaLabel = this.add.text(1250, GROUND_Y-180, 'BRENDA', {fontFamily:'Impact', fontSize:'13px', color:'#ffffff', backgroundColor:'#68416c', padding:{left:5,right:5,top:2,bottom:2}}).setOrigin(0.5);
    this.physics.add.existing(this.brenda);
    this.brenda.body.setAllowGravity(false);
    this.brendaAttackCooldown = false;
    this.brendaUsed = false;
    this.physics.add.overlap(this.player, this.brenda, ()=>this.meetBrenda(), null, this);

    // el tutor de la tesis — la aventura no es solo Instante, también tiene que sacar la tesis adelante
    this.tutor = this.add.text(2600, GROUND_Y-46, '📚', {fontSize:'46px'}).setOrigin(0.5);
    this.add.text(2600, GROUND_Y-84, 'TUTOR', {fontFamily:'Impact', fontSize:'12px', color:'#ffffff', backgroundColor:'#68416c', padding:{left:5,right:5,top:2,bottom:2}}).setOrigin(0.5);
    this.physics.add.existing(this.tutor);
    this.tutor.body.setAllowGravity(false);
    this.tutorUsed = false;
    this.physics.add.overlap(this.player, this.tutor, ()=>this.meetTutor(), null, this);

    // coleccionables
    this.collectibles = this.physics.add.group({ allowGravity:false });
    const coinXs = [200,260,320, 780, 900,960,1020, 1200,1310,1370,1500,1560, 1850,1910,1970, // el de 1200 va antes de Brenda (1250), para no solaparse con ella
                    2350,2410,2470, 2650,2710, 2950,3010,3070,3200, 3400,3450];
    coinXs.forEach((x,i)=>{
      const icon = (i%6===5) ? '⚡' : '🦄';
      const y = (x===780)? GROUND_Y-150 : GROUND_Y-60; // el de la repisa alta
      this.spawnCollectible(x,y,icon);
    });

    // meta: EL CONTRATO — un documento gigante sellado "FIRMADO", y ella entera, de cuerpo entero, potente, al lado
    const gx = WORLD_W-170, gy = GROUND_Y-120;
    this.goalZone = this.add.zone(gx, gy, 140, 220);
    this.physics.add.existing(this.goalZone);
    this.goalZone.body.setAllowGravity(false);
    // el papel del contrato
    this.add.rectangle(gx-58, gy+10, 96, 130, 0xf3ecd8).setStrokeStyle(3,0x141617).setAngle(-4);
    for(let i=0;i<5;i++) this.add.rectangle(gx-58, gy-32+i*16, 70, 4, 0xbdb190).setAngle(-4);
    this.add.circle(gx-40, gy+48, 13, PALETTE.red,1).setStrokeStyle(2,0x8a0f12).setAngle(-4);
    this.add.text(gx-58, gy-8, 'FIRMADO', {fontFamily:'Impact', fontSize:'15px', color:'#d83335'}).setOrigin(0.5).setAngle(-16);
    // ella, entera, sin recortes ni distorsión — proporción real de la foto
    this.add.rectangle(gx+42, gy-10, 118, 158, PALETTE.yellow, 1).setStrokeStyle(4, PALETTE.ink);
    this.add.image(gx+42, gy-10, 'aidaGoal').setDisplaySize(108,144);
    this.add.text(gx+42, gy-108, 'AIDA', {fontFamily:'Impact', fontSize:'22px', color:'#f2c749'}).setOrigin(0.5);
    this.physics.add.overlap(this.player, this.goalZone, ()=>this.reachGoal(), null, this);

    this.cameras.main.setZoom(1.0); // bajado de 1.2 — Manuel: "el muñeco es demasiado grande para la jugabilidad"
    this.cameras.main.startFollow(this.playerVisual, true, 0.1, 0.1);
    this.cameras.main.setDeadzone(80, 200);

    // HUD (fijo en pantalla)
    // franja de los colores de Instante, fija en pantalla — la marca también en primer plano
    [PALETTE.turquoise, PALETTE.pink, PALETTE.yellow].forEach((c,i)=>{
      this.add.rectangle(W/2, H-10+i*4, W, 4, c, 0.95).setScrollFactor(0).setDepth(60);
    });
    this.hud = this.add.text(10,10, '', {fontFamily:'Arial', fontSize:'16px', color:'#141617', backgroundColor:'#ffffffaa', padding:{left:8,right:8,top:4,bottom:4}})
      .setScrollFactor(0);
    this.updateHud();

    this.win = false;
    this.respawnX = 80;
  }

  drawBackground(){
    // atardecer de Granada, rojo/negro — la paleta de la escena de la Casa de las Hojas Azules
    const g = this.add.graphics();
    g.fillGradientStyle(0x3a1113,0x3a1113,0x140a0a,0x140a0a,1);
    g.fillRect(0,0,WORLD_W,H).setScrollFactor(0.1);
    // sol/luna grande y bajo, muy Tarantino
    for(let i=0;i<3;i++){
      const x = i*900+300;
      this.add.circle(x, 150, 80, PALETTE.yellow, 0.5).setScrollFactor(0.15);
    }
    // silueta de la Alhambra: torres almenadas, a lo lejos
    for(let i=0;i<9;i++){
      const x = i*300+40;
      const th = 90 + (i%3)*30;
      this.add.rectangle(x, GROUND_Y - th/2 + 30, 46, th, 0x1c0d0d).setScrollFactor(0.35);
      for(let m=0;m<4;m++) this.add.rectangle(x-17+m*11, GROUND_Y-th+22, 8, 12, 0x1c0d0d).setScrollFactor(0.35);
    }
    // skyline de Granada más cerca, más denso
    for(let i=0;i<16;i++){
      const x = i*170+90;
      const th = 60 + ((i*37)%70);
      this.add.rectangle(x, GROUND_Y - th/2 + 10, 90, th, 0x24100f).setScrollFactor(0.55);
      for(let wRow=0;wRow<Math.floor(th/22);wRow++){
        this.add.rectangle(x-24+((i)%3)*20, GROUND_Y-th+16+wRow*22, 10, 12, PALETTE.yellow, 0.55).setScrollFactor(0.55);
      }
    }
    // el OJO DE LA MARCA, de verdad y en mosaico, flotando sobre Granada — Manuel pidió "Instante en el fondo"
    // y no solo el texto: esta es la imagen real que él mismo mandó, con el blanco pasado a transparente
    this.add.tileSprite(0, 0, WORLD_W, H, 'ojosInstante')
      .setOrigin(0,0).setScrollFactor(0.25).setAlpha(0.17).setTileScale(1.7); // ojos MÁS GRANDES (Manuel: "el ojo de Instante al fondo, en grande")
    // EL OJO DE LA MARCA, ENORME, presidiendo el fondo — no un detalle, la imagen que manda en la pantalla
    for(let i=0;i<5;i++){
      this.add.image(i*760+240, 150, 'instanteLogo')
        .setDisplaySize(330,210).setAlpha(0.20).setScrollFactor(0.18);
    }
    // COLLAGE DE MARCA: círculos y barras planas en los colores de Instante, como su propio material gráfico
    const brand = [PALETTE.turquoise, PALETTE.pink, PALETTE.yellow, PALETTE.purple];
    for(let i=0;i<16;i++){
      const x = i*240 + 110, c = brand[i%4];
      if(i%3===0)      this.add.circle(x, 80+(i%4)*48, 46+(i%3)*26, c, 0.22).setScrollFactor(0.22);
      else if(i%3===1) this.add.rectangle(x, 110+(i%5)*42, 210, 18, c, 0.24).setScrollFactor(0.22);
      else             this.add.rectangle(x, 70+(i%4)*54, 18, 140, c, 0.20).setScrollFactor(0.22);
    }
    // marca "INSTANTE" y "AIDA" de fondo, repetida — es su mundo, ganado a pulso
    for(let i=0;i<6;i++){
      const x = i*480+260;
      this.add.text(x, 190, 'INSTANTE', {
        fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'46px', color:'#e4378c'
      }).setOrigin(0.5).setAlpha(0.20).setScrollFactor(0.3);
      this.add.text(x+240, 260, 'AIDA', {
        fontFamily:'Impact, Arial Narrow, sans-serif', fontSize:'80px', color:'#f2c749'
      }).setOrigin(0.5).setAlpha(0.14).setScrollFactor(0.3);
    }
  }

  spawnEnemy(x,y,type,min,max,faceKey){
    // sombra en el suelo, para que se lean como un adversario real plantado ahí, no un emoji flotando
    const shadow = this.add.ellipse(x,y+38,70,17,0x000000,0.35);
    const ENEMY_LABEL = { burocracia:'BUROCRACIA', machirulo:'MACHIRULO', chirulo_viejo:'VIEJO CHIRULO' };
    const ENEMY_TAGCOLOR = { burocracia:'#141617', machirulo:'#68416c', chirulo_viejo:'#d83335' };
    const label = this.add.text(x,y-70, ENEMY_LABEL[type], {
      fontFamily:'Impact', fontSize:'13px', color:'#ffffff', backgroundColor: ENEMY_TAGCOLOR[type], padding:{left:6,right:6,top:2,bottom:2}
    }).setOrigin(0.5);
    // caras ilustradas de verdad para machirulo/viejo (generadas + recortadas); burocracia se queda en emoji, es papeleo, no una persona
    // más grandes, "para que se vean" (Manuel, 25 jul): 56 → 76 px
    const t = faceKey ? this.add.image(x,y,faceKey).setDisplaySize(76,76) : this.add.text(x,y, ENEMY_ICON[type], {fontSize:'70px'}).setOrigin(0.5);
    this.physics.add.existing(t);
    t.body.setAllowGravity(false);
    t.dir = -1; t.min = min; t.max = max; t.type = type;
    t.shadow = shadow; t.label = label;
    t.body.setVelocityX(-60);
    this.enemies.add(t);
  }

  spawnCollectible(x,y,icon){
    const t = this.add.text(x,y, icon, {fontSize:'26px'}).setOrigin(0.5);
    this.physics.add.existing(t);
    t.body.setAllowGravity(false);
    t.icon = icon;
    this.collectibles.add(t);
    this.physics.add.overlap(this.player, t, ()=>this.collect(t), null, this);
  }

  collect(t){
    if(!t.active) return;
    t.destroy();
    (t.icon==='⚡' ? sfxBonus : sfxCoin)(this); // cada cosa que coge, suena
    this.score += (t.icon==='⚡') ? 2 : 1;
    this.updateHud();
    // en orden, no al azar — así en un recorrido completo las DICE TODAS, no depende de la suerte
    this.sayPhrase(CATCHPHRASES[this.phraseIndex % CATCHPHRASES.length]);
    this.phraseIndex++;
  }

  sayPhrase(text){
    speakPhrase(text);
    const px = this.playerVisual.x, py = this.playerVisual.y - 190;
    const bubble = this.add.text(px, py, text, {
      fontFamily:'Impact', fontSize:'14px', color:'#141617', backgroundColor:'#f2c749',
      padding:{left:8,right:8,top:4,bottom:4}, align:'center', wordWrap:{width:180}
    }).setOrigin(0.5);
    this.tweens.add({targets:bubble, y:bubble.y-18, alpha:0, duration:1500, delay:500, onComplete:()=>bubble.destroy()});
  }

  onEnemyTouch(en){
    if(this.attacking) this.defeatEnemy(en);
    else this.hitEnemy(en);
  }

  performAttack(){
    if(this.win || this.lives<=0 || this.attackCooldown) return;
    this.attackCooldown = true;
    this.attacking = true;
    playSwoosh(this);
    // ESTELA DEL TAJO — un arco blanco que barre delante de ella: el golpe se VE, no solo se intuye
    const dir = this.player.flipX ? -1 : 1;
    const fx = this.add.graphics();
    fx.lineStyle(8, 0xffffff, 0.95);
    fx.beginPath(); fx.arc(0,0,62, Phaser.Math.DegToRad(-62), Phaser.Math.DegToRad(62), false); fx.strokePath();
    fx.lineStyle(3, PALETTE.turquoise, 0.9);
    fx.beginPath(); fx.arc(0,0,50, Phaser.Math.DegToRad(-52), Phaser.Math.DegToRad(52), false); fx.strokePath();
    fx.setPosition(this.player.x + dir*16, this.player.y - 30);
    fx.setScale(dir*0.55, 0.55);
    this.tweens.add({targets:fx, scaleX:dir*1.2, scaleY:1.2, alpha:0, duration:250, ease:'Cubic.easeOut', onComplete:()=>fx.destroy()});
    this.cameras.main.shake(60, 0.003); // el tajo se nota en la cámara
    // el flip de lado ya lo hace el scaleX del contenedor en update(); el ángulo del tajo es siempre el mismo
    this.katana.setRotation(Phaser.Math.DegToRad(18));
    this.tweens.add({
      targets:this.katana, rotation:Phaser.Math.DegToRad(-150), duration:140, yoyo:true, ease:'Cubic.easeOut',
      onComplete: ()=> this.katana.setRotation(Phaser.Math.DegToRad(18))
    });
    // LA KATANA TIENE ALCANCE: alcanza a quien tenga delante, no hace falta chocarse con él.
    // (Antes solo mataba si el cuerpo tocaba al enemigo justo en los 160 ms del tajo — por eso
    //  atacar "no hacía nada" si no la pegabas pegadísima.)
    this.enemies.getChildren().slice().forEach(e=>{
      const dx = (e.x - this.player.x) * dir;
      if(dx > -24 && dx < 96 && Math.abs(e.y - this.player.y) < 90) this.defeatEnemy(e);
    });
    this.time.delayedCall(160, ()=> this.attacking=false);
    this.time.delayedCall(360, ()=> this.attackCooldown=false);
  }

  defeatEnemy(en){
    if(!en.active) return;
    const x=en.x, y=en.y;
    const label = en.type==='machirulo' ? '¡SUÉLTAME EL BRAZO, HIJO DE PUTA!'
      : en.type==='chirulo_viejo' ? '¡A CASA, ABUELO!'
      : `¡${Phaser.Utils.Array.GetRandom(INSTANTE_SERVICES)} ENTREGADO A TIEMPO!`;
    speakPhrase(label);
    playImpact(this); // el golpe que aterriza suena grave y seco, no solo el silbido del aire
    en.shadow.destroy(); en.label.destroy();
    en.destroy();
    this.score += 2;
    this.updateHud();
    // ráfaga de confeti/papel, sin sangre ni violencia real — solo la actitud
    for(let i=0;i<8;i++){
      const p = this.add.rectangle(x,y, 6,6, [PALETTE.yellow,PALETTE.pink,PALETTE.turquoise,0xffffff][i%4]);
      this.tweens.add({
        targets:p, x:x+Phaser.Math.Between(-50,50), y:y+Phaser.Math.Between(-60,10),
        alpha:0, rotation:Phaser.Math.Between(-4,4), duration:500, onComplete:()=>p.destroy()
      });
    }
    const t = this.add.text(x, y-30, label, {fontFamily:'Impact', fontSize:'13px', color:'#ffffff', backgroundColor:'#d83335', padding:{left:6,right:6,top:3,bottom:3}}).setOrigin(0.5);
    this.tweens.add({targets:t, y:t.y-24, alpha:0, duration:600, onComplete:()=>t.destroy()});
    // destello blanco de impacto + estrella de corte, para que el golpe se lea de lejos
    const flash = this.add.circle(x, y, 34, 0xffffff, 0.9);
    this.tweens.add({targets:flash, scale:2.1, alpha:0, duration:220, onComplete:()=>flash.destroy()});
    const star = this.add.graphics();
    star.lineStyle(4, PALETTE.yellow, 1);
    for(let a=0;a<4;a++){
      const ang = Phaser.Math.DegToRad(a*45+15);
      star.beginPath();
      star.moveTo(Math.cos(ang)*-26, Math.sin(ang)*-26);
      star.lineTo(Math.cos(ang)*26, Math.sin(ang)*26);
      star.strokePath();
    }
    star.setPosition(x,y);
    this.tweens.add({targets:star, scale:1.9, alpha:0, duration:300, onComplete:()=>star.destroy()});
    this.cameras.main.shake(150, 0.011); // el impacto sacude de verdad (antes 90/0.005, apenas se notaba)
  }

  hitEnemy(en){
    if(this.invuln) return;
    this.lives--; this.invuln = true;
    sfxHurt(this);
    this.cameras.main.shake(120, 0.008);
    this.player.setVelocity(this.player.flipX? 160:-160, -260);
    this.time.delayedCall(1200, ()=> this.invuln=false);
    this.updateHud();
    if(this.lives<=0) this.gameOver();
  }

  fallInPit(){
    if(this.invuln || this.win) return;
    this.lives--; this.invuln = true;
    this.player.setPosition(this.respawnX, GROUND_Y-80);
    this.player.setVelocity(0,0);
    this.time.delayedCall(1200, ()=> this.invuln=false);
    this.updateHud();
    if(this.lives<=0) this.gameOver();
  }

  meetBrenda(){
    if(this.brendaUsed) return;
    this.brendaUsed = true;
    this.lives = Math.min(4, this.lives+1);
    this.score += 3;
    this.updateHud();
    speakPhrase('¡Voy contigo!');
    // FICHA DE PERSONAJE: SU CARA EN GRANDE, en mitad de la pantalla, con su nombre.
    // Manuel insistió dos veces en "que Brenda tenga su propia cara" — aquí ya no hay forma de no verla.
    const card = this.add.container(W/2, H*0.42).setScrollFactor(0).setDepth(70);
    const ring = this.add.circle(0, 0, 64, PALETTE.purple, 1).setStrokeStyle(4, PALETTE.turquoise);
    const face = this.add.image(0, 0, 'brendaFace').setDisplaySize(120,120);
    const nombre = this.add.text(0, 82, 'BRENDA', {
      fontFamily:'Impact', fontSize:'26px', color:'#ffffff', backgroundColor:'#68416c', padding:{left:10,right:10,top:3,bottom:3}
    }).setOrigin(0.5);
    const sub = this.add.text(0, 112, '¡Voy contigo!  +1 ❤️', {
      fontFamily:'Arial', fontSize:'14px', color:'#f2c749'
    }).setOrigin(0.5);
    card.add([ring, face, nombre, sub]);
    card.setScale(0.4); card.setAlpha(0);
    this.tweens.add({targets:card, scale:1, alpha:1, duration:280, ease:'Back.easeOut'});
    this.tweens.add({targets:card, alpha:0, duration:400, delay:2000, onComplete:()=>card.destroy()});
    // y su cara se queda fija en el HUD mientras te acompaña, para que se sepa que va contigo
    // (abajo a la izquierda, no arriba a la derecha: ahí está el botón de silenciar)
    this.brendaBadge = this.add.image(30, 62, 'brendaFace').setDisplaySize(42,42).setScrollFactor(0).setDepth(60);
    this.add.circle(30, 62, 23, 0x000000, 0).setStrokeStyle(2, PALETTE.turquoise).setScrollFactor(0).setDepth(60);
    this.add.text(56, 62, 'contigo', {fontFamily:'Impact', fontSize:'11px', color:'#40ada9'}).setOrigin(0,0.5).setScrollFactor(0).setDepth(60);
  }

  meetTutor(){
    if(this.tutorUsed) return;
    this.tutorUsed = true;
    this.physics.pause();
    activeChapter1 = this;
    const overlay = document.getElementById('thesis-overlay');
    document.getElementById('thesis-title').textContent = '📚 EL TUTOR';
    document.getElementById('thesis-msg').textContent = 'Para acabar la tesis hace falta un artículo más. Título:';
    const input = document.getElementById('thesis-input');
    input.value = '';
    overlay.classList.add('show');
    this.time.delayedCall(50, ()=> input.focus());
  }

  onArticleSubmitted(title){
    this.physics.resume();
    const t = title && title.trim() ? title.trim() : 'Sin título (ya lo pondrás)';
    this.score += 5;
    this.articulos += 1;
    this.updateHud();
    speakPhrase('¡El revisor lo ha pasado!');
    const msg = this.add.text(this.player.x, this.player.y-190, `📖 "${t}"\n¡El revisor lo ha pasado! ✅`, {
      fontFamily:'Arial', fontSize:'13px', color:'#141617', backgroundColor:'#f2c749', align:'center',
      padding:{left:8,right:8,top:5,bottom:5}, wordWrap:{width:200}
    }).setOrigin(0.5);
    this.tweens.add({targets:msg, y:msg.y-24, alpha:0, duration:2200, delay:900, onComplete:()=>msg.destroy()});
  }

  reachGoal(){
    if(this.win) return;
    this.win = true;
    this.physics.pause();
    this.add.rectangle(W/2, H/2, W, H, 0x0c0d0e, 0.9).setScrollFactor(0);
    // el logo de Instante, GRANDE, en la pantalla final — pedido explícito: "tiene que verse el logotipo al final"
    this.add.image(W/2, H*0.28, 'instanteLogo').setDisplaySize(90,58).setScrollFactor(0);
    this.add.text(W/2, H*0.4, '¡CONTRATO FIRMADO!', {fontFamily:'Impact', fontSize:'26px', color:'#f2c749'}).setOrigin(0.5).setScrollFactor(0);
    this.add.text(W/2, H*0.48, '¡OLÉ INSTANTE! ¡VIVA LA AGENCIA INSTANTE!', {fontFamily:'Impact', fontSize:'14px', color:'#e4378c', align:'center', wordWrap:{width:W-60}}).setOrigin(0.5).setScrollFactor(0);
    speakPhrase('¡Contrato firmado! ¡Olé Instante! ¡Viva la agencia Instante!');
    this.add.text(W/2, H*0.55, `🦄 recogidos: ${this.score}`, {fontFamily:'Arial', fontSize:'18px', color:'#ffffff'}).setOrigin(0.5).setScrollFactor(0);
    // las dos socias, con su cara, presidiendo el testimonio que las nombra a las dos
    this.add.circle(W/2-46, H*0.635, 25, 0x000000, 0).setStrokeStyle(3, PALETTE.yellow).setScrollFactor(0);
    this.add.image(W/2-46, H*0.635, 'aidaFace').setDisplaySize(46,46).setScrollFactor(0);
    this.add.circle(W/2+46, H*0.635, 25, 0x000000, 0).setStrokeStyle(3, PALETTE.turquoise).setScrollFactor(0);
    this.add.image(W/2+46, H*0.635, 'brendaFace').setDisplaySize(46,46).setScrollFactor(0);
    // testimonio REAL de un cliente de Instante, sacado literal de agenciainstante.com — no inventado
    this.add.text(W/2, H*0.73, '"Recomiendo 100% trabajar con Aida y Brenda.\nSon muy profesionales, muy creativas..."', {
      fontFamily:'Georgia, serif', fontSize:'11px', color:'#40ada9', fontStyle:'italic', align:'center', wordWrap:{width:W-70}
    }).setOrigin(0.5).setScrollFactor(0);
    this.add.text(W/2, H*0.80, '— Gabriel Rodríguez, CEO SinComisiones', {
      fontFamily:'Arial', fontSize:'10px', color:'#888', align:'center'
    }).setOrigin(0.5).setScrollFactor(0);
    this.add.text(W/2, H*0.88, 'El resto de capítulos llega pronto...', {fontFamily:'Arial', fontSize:'13px', color:'#40ada9'}).setOrigin(0.5).setScrollFactor(0);
  }

  gameOver(){
    this.physics.pause();
    this.add.rectangle(W/2, H/2, W, H, 0x0c0d0e, 0.9).setScrollFactor(0);
    const t = this.add.text(W/2, H*0.45, '¡CASI!', {fontFamily:'Impact', fontSize:'28px', color:'#d83335'}).setOrigin(0.5).setScrollFactor(0);
    const btn = this.add.text(W/2, H*0.58, '🔄 REINTENTAR', {fontFamily:'Arial', fontSize:'18px', color:'#141617', backgroundColor:'#f2c749', padding:{left:16,right:16,top:8,bottom:8}}).setOrigin(0.5).setScrollFactor(0).setInteractive({useHandCursor:true});
    btn.on('pointerdown', ()=> this.scene.restart());
  }

  updateHud(){
    this.hud.setText(`♥ ${'❤'.repeat(Math.max(0,this.lives))}   🦄 ${this.score}   📖 ${this.articulos}`);
  }

  update(){
    if(this.win || this.lives<=0) return;
    const speed = 200;
    if(keys.left){ this.player.setVelocityX(-speed); this.player.flipX = true; }
    else if(keys.right){ this.player.setVelocityX(speed); this.player.flipX = false; }
    if(jumpRequested){
      if(this.player.body.blocked.down || this.player.body.touching.down){
        this.player.setVelocityY(-640); // antes -480: con gravedad 1500 solo llegaba a 76px y la repisa está a 110px — NUNCA se podía alcanzar. Ahora llega a ~136px.
        sfxJump(this);
      }
      jumpRequested = false;
    }
    if(attackRequested){
      this.performAttack();
      attackRequested = false;
    }
    // 🗡️ Y ADEMÁS SE ACCIONA SOLA: si un malo se pone a tiro, ella se gira y tira el tajo sin
    // que Manuel toque nada. Pidió "un botón específico o que se accione sola" — están LAS DOS.
    if(!this.attackCooldown){
      const cerca = this.enemies.getChildren().find(e =>
        Math.abs(e.x - this.player.x) < 92 && Math.abs(e.y - this.player.y) < 90);
      if(cerca){
        this.player.flipX = cerca.x < this.player.x; // se gira hacia el que viene
        this.performAttack();
      }
    }
    if(this.player.body.blocked.down || this.player.body.touching.down){
      const seg = this.segs.find(s=> this.player.x >= s.x+30 && this.player.x <= s.x+s.w-30);
      if(seg) this.respawnX = Phaser.Math.Clamp(this.player.x, seg.x+40, seg.x+seg.w-40);
    }
    if(this.player.y > GROUND_Y + 50){
      this.fallInPit();
    }
    this.playerVisual.x = this.player.x;
    this.playerVisual.y = this.player.y;
    this.heroImage.setFlipX(this.player.flipX);
    this.logoBadge.x = this.player.flipX ? -6 : 6;
    this.katana.x = this.player.flipX ? -28 : 28; // la mano cambia de lado al girarse
    this.katana.setScale(this.player.flipX ? -1 : 1, 1);

    this.enemies.getChildren().forEach(e=>{
      e.x += e.dir * (e.type==='machirulo'? 1.0 : e.type==='chirulo_viejo'? 0.5 : 0.7);
      if(e.x<e.min){ e.x=e.min; e.dir=1; }
      if(e.x>e.max){ e.x=e.max; e.dir=-1; }
      e.setFlipX(e.dir>0);
      e.shadow.x = e.x; e.label.x = e.x;
    });

    // Brenda, ya de aliada: sigue a Aida y se pone A PELEAR — no solo a animar
    if(this.brendaUsed){
      const targetX = this.player.x + (this.player.flipX ? 70 : -70);
      this.brenda.x += (targetX - this.brenda.x) * 0.06;
      this.brenda.setFlipX(this.player.flipX);
      this.brendaLabel.x = this.brenda.x;
      this.brendaShadow.x = this.brenda.x;
      if(!this.brendaAttackCooldown){
        const target = this.enemies.getChildren().find(e => Math.abs(e.x-this.brenda.x) < 55);
        if(target){
          this.defeatEnemy(target);
          this.brendaAttackCooldown = true;
          this.time.delayedCall(450, ()=> this.brendaAttackCooldown=false);
        }
      }
    }
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-holder',
  width: W, height: H,
  backgroundColor: '#0c0d0e',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  render: { preserveDrawingBuffer: true },
  physics: { default:'arcade', arcade:{ gravity:{y:1500}, debug:false } },
  scene: [Boot, Intro, Title, Chapter1],
};
const game = new Phaser.Game(config);

/* ---------- CONTROLES ---------- */
function wireHold(id, onDown, onUp){
  const btn = document.getElementById(id);
  const down = ev=>{ ev.preventDefault(); onDown(); };
  const up = ()=>{ onUp && onUp(); };
  btn.addEventListener('touchstart', down, {passive:false});
  btn.addEventListener('mousedown', down);
  ['touchend','touchcancel'].forEach(e=>btn.addEventListener(e, up));
  ['mouseup','mouseleave'].forEach(e=>btn.addEventListener(e, up));
}
wireHold('btnLeft', ()=>keys.left=true, ()=>keys.left=false);
wireHold('btnRight', ()=>keys.right=true, ()=>keys.right=false);
wireHold('jump-btn', ()=>jumpRequested=true);
wireHold('attack-btn', ()=>attackRequested=true);

document.getElementById('mute-btn').addEventListener('click', toggleMute);

function submitArticle(){
  const overlay = document.getElementById('thesis-overlay');
  const input = document.getElementById('thesis-input');
  overlay.classList.remove('show');
  if(activeChapter1) activeChapter1.onArticleSubmitted(input.value);
}
document.getElementById('thesis-submit').addEventListener('click', submitArticle);
document.getElementById('thesis-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') submitArticle();
  e.stopPropagation(); // que las letras no se cuelen como controles del juego
});

// TECLADO. El tajo de la katana tiene MUCHAS teclas a propósito: Manuel pidió expresamente
// "poder darle a la katana con una tecla del teclado" y lo importante es que le valga la que pulse,
// no que acierte con la correcta. Están las de toda la vida (X, Z, Ctrl) más ENTER, MAYÚS,
// la A y la flecha ABAJO. Las teclas del juego cancelan el scroll de la página.
const TECLAS_TAJO = ['x','X','z','Z','a','A','Control','Shift','Enter','ArrowDown'];
document.addEventListener('keydown', e=>{
  if(e.repeat) return; // que mantener pulsado no dispare cien tajos
  if(e.key==='ArrowLeft') keys.left=true;
  if(e.key==='ArrowRight') keys.right=true;
  if(e.key==='ArrowUp' || e.key===' ') jumpRequested=true;
  if(TECLAS_TAJO.includes(e.key)) attackRequested=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft') keys.left=false;
  if(e.key==='ArrowRight') keys.right=false;
});
